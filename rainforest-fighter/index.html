<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨林拳霸 · Jungle Brawl</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123a22'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-size='34' font-family='sans-serif' font-weight='900' fill='%23ffd24a'%3EKO%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#06110b;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",system-ui,sans-serif;color:#f4f1dc;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #wrap{position:relative;--s:1;font-size:calc(16px * var(--s));}
  canvas{display:block;}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;overflow:auto;
    font-size:clamp(12px,calc(16px * var(--s)),18px);
    background:radial-gradient(ellipse at center,rgba(4,18,10,.35),rgba(2,10,6,.78));}
  .overlay.show{display:flex;}
  .panel{width:min(44em,94vw);max-height:94vh;overflow:auto;padding:1.6em 2em 1.4em;border-radius:1.1em;text-align:center;
    background:linear-gradient(160deg,rgba(18,48,30,.92),rgba(8,26,16,.94));
    border:.12em solid rgba(214,190,110,.55);box-shadow:0 1.2em 3em rgba(0,0,0,.55),inset 0 0 2.5em rgba(120,200,110,.12);}
  .kicker{letter-spacing:.35em;font-size:.72em;color:#b9d98f;font-weight:700;}
  h1{margin:.12em 0 0;font-size:3.4em;line-height:1.1;letter-spacing:.08em;
    background:linear-gradient(180deg,#fff6c8 0%,#ffd24a 45%,#e8731f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 .08em 0 #3b1a06) drop-shadow(0 .2em .4em rgba(0,0,0,.6));}
  .sub{margin:.3em 0 1em;font-size:.95em;color:#d7e8c0;letter-spacing:.12em;}
  .row{display:flex;align-items:center;justify-content:center;gap:.8em;margin:.5em 0;font-size:.92em;}
  .row>span{color:#b9d98f;min-width:5em;text-align:right;}
  .seg{display:inline-flex;border-radius:.6em;overflow:hidden;border:.08em solid rgba(214,190,110,.5);}
  .seg button{background:rgba(255,255,255,.06);color:#e9f2d8;border:0;padding:.42em .95em;font:inherit;cursor:pointer;}
  .seg button+button{border-left:.08em solid rgba(214,190,110,.35);}
  .seg button.on{background:linear-gradient(180deg,#ffd24a,#e8851f);color:#2b1606;font-weight:700;}
  .btns{display:flex;gap:1em;justify-content:center;margin:1.1em 0 .9em;flex-wrap:wrap;}
  .btn{font:inherit;font-size:1.08em;font-weight:800;letter-spacing:.06em;padding:.65em 1.5em;border-radius:.7em;cursor:pointer;
    border:.1em solid #ffe9a0;color:#2b1606;background:linear-gradient(180deg,#ffe27a,#f09a2a);box-shadow:0 .3em 0 #8a4512,0 .5em 1.2em rgba(0,0,0,.4);}
  .btn:hover{filter:brightness(1.08);transform:translateY(-.05em);}
  .btn:active{transform:translateY(.2em);box-shadow:0 .1em 0 #8a4512;}
  .btn.alt{background:linear-gradient(180deg,#9ff06a,#3fae3a);border-color:#d8ffb8;box-shadow:0 .3em 0 #1f5a1c,0 .5em 1.2em rgba(0,0,0,.4);color:#0c2a0a;}
  .btn.ghost{background:rgba(255,255,255,.08);color:#f4f1dc;border-color:rgba(255,255,255,.35);box-shadow:none;}
  table.keys{margin:.2em auto .6em;border-collapse:collapse;font-size:.8em;}
  table.keys th,table.keys td{padding:.22em .9em;border-bottom:.06em solid rgba(214,190,110,.18);}
  table.keys th{color:#b9d98f;font-weight:700;}
  kbd{display:inline-block;min-width:1.5em;padding:.05em .35em;border-radius:.3em;background:#f4f1dc;color:#1d2a16;font-family:inherit;font-weight:700;font-size:.92em;box-shadow:0 .12em 0 #8c8770;}
  .tip{font-size:.76em;color:#c9dcb0;line-height:1.6;}
  #result h2{margin:.1em 0 .2em;font-size:3em;letter-spacing:.06em;color:#ffd24a;text-shadow:0 .08em 0 #4a2008,0 .2em .5em rgba(0,0,0,.6);}
  #result p{margin:.2em 0 .6em;color:#d7e8c0;}
  #hudBtns{position:absolute;right:1em;bottom:.8em;display:flex;gap:.5em;}
  #hudBtns button{font:inherit;font-size:.78em;padding:.35em .8em;border-radius:.5em;border:.08em solid rgba(255,255,255,.35);
    background:rgba(5,20,12,.55);color:#f4f1dc;cursor:pointer;}
  #hudBtns button.off{opacity:.45;text-decoration:line-through;}
  #touch{position:absolute;inset:0;pointer-events:none;display:none;}
  #touch.show{display:block;}
  #touch .pad{position:absolute;bottom:4.5em;display:grid;gap:.4em;pointer-events:auto;}
  #touch .pad.left{left:1.4em;grid-template-columns:repeat(3,3.6em);grid-template-rows:repeat(2,3.6em);}
  #touch .pad.right{right:1.4em;grid-template-columns:repeat(3,4.2em);}
  #touch button{border-radius:50%;border:.12em solid rgba(255,255,255,.45);background:rgba(10,30,18,.45);color:#fff;font:inherit;font-weight:800;font-size:1em;touch-action:none;}
  #touch button.act{border-radius:1em;height:4.2em;}
  #touch button.down{background:rgba(255,210,74,.6);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="menu" class="overlay show">
    <div class="panel">
      <div class="kicker">TROPICAL RAINFOREST FIGHTING</div>
      <h1>雨林拳霸</h1>
      <div class="sub">JUNGLE BRAWL · 人类武者 VS 直立蜥蜴</div>
      <div class="row"><span>你的角色</span>
        <div class="seg" data-opt="char"><button data-v="human" class="on">人类武者 · 凯</button><button data-v="lizard">蜥蜴战士 · 雷克斯</button></div>
      </div>
      <div class="row"><span>电脑难度</span>
        <div class="seg" data-opt="diff"><button data-v="easy">简单</button><button data-v="normal" class="on">普通</button><button data-v="hard">困难</button></div>
      </div>
      <div class="btns">
        <button class="btn" id="btnCPU">单人 · 挑战电脑</button>
        <button class="btn alt" id="btn2P">双人 · 同屏对战</button>
      </div>
      <table class="keys">
        <tr><th>动作</th><th>玩家 1</th><th>玩家 2</th></tr>
        <tr><td>前进 / 后退</td><td><kbd>A</kbd> <kbd>D</kbd></td><td><kbd>←</kbd> <kbd>→</kbd></td></tr>
        <tr><td>跳跃 / 蹲下</td><td><kbd>W</kbd> <kbd>S</kbd></td><td><kbd>↑</kbd> <kbd>↓</kbd></td></tr>
        <tr><td>拳 / 脚</td><td><kbd>J</kbd> <kbd>K</kbd></td><td><kbd>1</kbd> <kbd>2</kbd>（小键盘）或 <kbd>,</kbd> <kbd>.</kbd></td></tr>
        <tr><td>远程光波</td><td><kbd>L</kbd></td><td><kbd>3</kbd>（小键盘）或 <kbd>/</kbd></td></tr>
      </table>
      <div class="tip">三局两胜 · 按住“后退”自动格挡 · 蹲下或跳跃可躲开光波 · 蹲下 + 脚为扫腿<br>单人模式也可用方向键移动 · <kbd>P</kbd> 暂停 · <kbd>M</kbd> 音乐 · <kbd>N</kbd> 音效</div>
    </div>
  </div>

  <div id="pause" class="overlay">
    <div class="panel" style="width:26em">
      <h1 style="font-size:2.6em">暂停</h1>
      <div class="btns"><button class="btn" id="btnResume">继续战斗</button><button class="btn ghost" id="btnQuit1">返回主菜单</button></div>
    </div>
  </div>

  <div id="result" class="overlay">
    <div class="panel" style="width:30em">
      <div class="kicker">MATCH OVER</div>
      <h2 id="resTitle">胜利</h2>
      <p id="resSub"></p>
      <div class="btns"><button class="btn" id="btnAgain">再来一局</button><button class="btn ghost" id="btnQuit2">返回主菜单</button></div>
    </div>
  </div>

  <div id="hudBtns"><button id="btnMusic">♪ 音乐</button><button id="btnSfx">音效</button><button id="btnPause">暂停</button></div>

  <div id="touch">
    <div class="pad left">
      <span></span><button data-k="up">▲</button><span></span>
      <button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button>
    </div>
    <div class="pad right">
      <button class="act" data-k="punch">拳</button><button class="act" data-k="kick">脚</button><button class="act" data-k="wave">波</button>
    </div>
  </div>
</div>

<script src="voices.js"></script>
<script>
'use strict';
/* ================= 基础常量 ================= */
const W=1280,H=720,GROUND=622,STAGE_W=1960,MAXSEP=W-150,GRAV=2600;
const JUMP_V=980,JUMP_VX=300,WALK_F=270,WALK_B=210,WAVE_CD=1.6,ROUND_TIME=99;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const approach=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const canvas=document.querySelector('#game');
const ctx=canvas.getContext('2d');
const wrap=document.querySelector('#wrap');
let K=1,RS=0,BG=null;

/* ================= 招式数据 ================= */
// box: [前方偏移, 相对脚底的顶部 y, 宽, 高]
const MOVES={
  punch :{st:.07,ac:.08,rc:.15,dmg:6, chip:0,stun:.26,push:200,hit:'high',box:[16,-160,82,30],lunge:60},
  kick  :{st:.12,ac:.10,rc:.24,dmg:10,chip:1,stun:.34,push:270,hit:'mid', box:[20,-134,100,38],heavy:true,lunge:40},
  cpunch:{st:.06,ac:.08,rc:.14,dmg:5, chip:0,stun:.24,push:170,hit:'mid', box:[14,-112,78,26],crouch:true},
  ckick :{st:.12,ac:.11,rc:.30,dmg:9, chip:1,stun:.40,push:220,hit:'low', box:[18,-40,116,34],crouch:true,knock:true,heavy:true},
  jpunch:{st:.06,ac:.18,rc:.06,dmg:7, chip:0,stun:.30,push:200,hit:'air', box:[8,-160,80,44],air:true},
  jkick :{st:.08,ac:.24,rc:.06,dmg:10,chip:1,stun:.36,push:250,hit:'air', box:[12,-112,96,52],air:true,heavy:true},
  wave  :{st:.32,ac:0,  rc:.30,dmg:12,chip:3,stun:.42,push:280,hit:'mid'}
};

const CHARS={
  human:{id:'human',name:'KAI',cn:'武者 · 凯',thigh:46,shin:46,upper:32,fore:31,torso:60,neck:9,head:17,foot:6,hud:'#ff6a3c',
    wave:{core:'#ffffff',mid:'rgba(150,235,255,',outer:'rgba(40,130,255,'},
    pal:{skin:'#dba375',skinD:'#b47b4f',gi:'#f5f2e9',giD:'#cdc5b0',belt:'#1c1c1c',band:'#e3262a',bandD:'#a8151a',hair:'#22160f',tape:'#efe6d2',line:'#3a2a1d'}},
  lizard:{id:'lizard',name:'REX',cn:'蜥蜴战士 · 雷克斯',thigh:48,shin:48,upper:34,fore:32,torso:62,neck:13,head:16,foot:6,hud:'#7fe03c',
    wave:{core:'#fbffe0',mid:'rgba(190,255,90,',outer:'rgba(60,200,40,'},
    pal:{sc:'#63b53f',scD:'#3f812c',scL:'#97d860',belly:'#ecdf8a',bellyD:'#c5b25c',crest:'#ef7b2c',crestD:'#b94f16',claw:'#f4efd9',cloth:'#7c502a',clothD:'#57381c',eye:'#ffd23f',mouth:'#5a1414',line:'#1d3a14',bone:'#efe8d0'}}
};
const OUTLINE_COL='#08130b';
const outlinePal=p=>{const o={};for(const k in p)o[k]=OUTLINE_COL;return o;};
const whitePal=p=>{const o={};for(const k in p)o[k]='#ffffff';return o;};
for(const c of Object.values(CHARS)){c.palO=outlinePal(c.pal);c.palW=whitePal(c.pal);}

/* ================= 游戏状态 ================= */
const game={phase:'menu',mode:'cpu',diff:'normal',p1char:'human',round:1,wins:[0,0],timer:ROUND_TIME,phaseT:0,
  timeScale:1,hitstop:0,shake:0,flash:0,flashCol:'#fff',banner:null,result:null,paused:false,camX:(STAGE_W-W)/2,zoom:1,time:0,flags:{}};
let fighters=[],projectiles=[],parts=[],atkCounter=0;
const NOCTRL={left:false,right:false,up:false,down:false};

function makeFighter(cid,side){
  const f={cid,cfg:CHARS[cid],side,x:STAGE_W/2+(side?1:-1)*240,y:GROUND,vx:0,vy:0,facing:side?-1:1,hp:100,dispHp:100,dmgT:0,
    st:'idle',t:0,grounded:true,move:null,moveHit:false,atkId:0,chain:0,airAtk:false,stun:0,crouchStun:false,downed:false,
    cd:0,inv:0,flash:0,walkPh:0,guard:false,spawned:false,holdBack:false,anim:Math.random()*5,
    ctrl:{left:false,right:false,up:false,down:false},buf:{punch:0,kick:0,wave:0},ai:{t:0,threat:null,seen:-1},isAI:false,pose:null};
  f.pose=poseTarget(f);f.pose.hipH=autoHip(f.cfg,f.pose);
  return f;
}

/* ================= 姿态 / 骨骼 ================= */
function P(lean,fa,ba,fl,bl,o){return Object.assign({lean,head:0,fa:fa.slice(),ba:ba.slice(),fl:fl.slice(),bl:bl.slice(),rot:0,hipH:null,jaw:0},o||{});}
const L_STAND={fl:[0.42,-0.45],bl:[-0.3,-0.12]}, L_CROUCH={fl:[1.38,-2.2],bl:[0.6,-2.3]};
const A_GUARD={fa:[0.85,1.75],ba:[0.45,2.05]}, A_BLOCK={fa:[1.3,2.25],ba:[1.05,2.45]};
function isCrouching(f){
  if(f.st==='crouch')return true;
  if(f.st==='attack')return !!MOVES[f.move].crouch;
  if(f.st==='hit'||f.st==='block')return f.crouchStun;
  return false;
}
function poseTarget(f){
  const t=f.anim,b=Math.sin(t*3.2)*0.04,liz=f.cid==='lizard';
  const idleJaw=liz?0:0;
  switch(f.st){
    case 'walk':{const s=Math.sin(f.walkPh),c=Math.cos(f.walkPh);
      return P(0.12,[0.85+s*.08,1.75],[0.45-s*.08,2.05],[0.38+s*.36,-0.4-Math.max(0,c)*.6],[-0.28-s*.36,-0.12-Math.max(0,-c)*.6]);}
    case 'crouch':
      return f.guard?P(0.5,A_BLOCK.fa,A_BLOCK.ba,L_CROUCH.fl,L_CROUCH.bl,{head:-.2}):P(0.62,[1.0,1.6],[0.6,1.9],L_CROUCH.fl,L_CROUCH.bl,{head:-.3});
    case 'jump':return P(0.15,[1.2,1.6],[0.8,1.9],[1.15,-1.95],[0.45,-1.7],{hipH:96});
    case 'hit':return f.crouchStun?P(0.15,[0.3,.9],[-.1,.7],L_CROUCH.fl,L_CROUCH.bl,{head:-.4}):P(-0.38,[0.3,0.9],[-0.2,0.7],[0.3,-0.25],[-0.42,-0.3],{head:-0.4});
    case 'block':return f.crouchStun?P(0.5,A_BLOCK.fa,A_BLOCK.ba,L_CROUCH.fl,L_CROUCH.bl,{head:-.2}):P(-0.06,A_BLOCK.fa,A_BLOCK.ba,L_STAND.fl,L_STAND.bl,{head:-.1});
    case 'knock':case 'ko':
      if(!f.grounded)return P(-0.3,[2.2,0.4],[2.5,0.3],[0.6,-0.6],[0.2,-0.4],{rot:-Math.min(1.5,f.t*4.5),hipH:90,head:-.3,jaw:liz?.8:0});
      return P(0,[2.7,0.2],[2.95,0.1],[0.15,-0.1],[-0.05,0],{rot:-1.52,hipH:13,head:0.25});
    case 'win':
      return liz?P(-0.22,[2.55,0.5],[2.35,0.6],[0.38,-0.2],[-0.35,-0.1],{head:-0.45,jaw:Math.sin(t*6)>-0.2?1:0.5})
                :P(0.02,[3.02,0.12+Math.sin(t*5)*.06],[0.35,1.1],[0.3,-0.2],[-0.3,-0.1],{head:-0.15});
    case 'lose':return P(0.48,[0.2,0.3],[0.1,0.3],[0.42,-0.6],[-0.2,-0.4],{head:0.5});
    case 'attack':return attackPose(f);
    default:
      if(f.guard)return P(-0.04,A_BLOCK.fa,A_BLOCK.ba,L_STAND.fl,L_STAND.bl,{head:-.1});
      return P(0.1+b*.5,[A_GUARD.fa[0]+b,A_GUARD.fa[1]],[A_GUARD.ba[0]+b,A_GUARD.ba[1]],L_STAND.fl,L_STAND.bl,{jaw:idleJaw});
  }
}
function attackPose(f){
  const m=MOVES[f.move],t=f.t,strike=t<m.st+m.ac+0.04,liz=f.cid==='lizard',jaw=liz?1:0;
  switch(f.move){
    case 'punch':return strike?P(0.24,[1.56,0.04],[0.3,2.3],[0.52,-0.4],[-0.4,-0.05],{head:-.1,jaw}):P(0.1,A_GUARD.fa,A_GUARD.ba,L_STAND.fl,L_STAND.bl);
    case 'kick':return strike?P(-0.24,[1.0,1.9],[0.3,2.2],[1.85,-0.05],[-0.12,0],{jaw}):P(-0.1,A_GUARD.fa,A_GUARD.ba,[1.2,-1.7],[-0.1,0]);
    case 'cpunch':return P(0.66,strike?[1.62,0.02]:[1.0,1.6],[0.5,2.0],L_CROUCH.fl,L_CROUCH.bl,{head:-.3,jaw:strike?jaw:0});
    case 'ckick':return strike?P(0.5,[1.0,1.7],[0.3,1.9],[1.52,-0.04],[0.75,-2.45],{jaw}):P(0.6,[1.0,1.6],[0.6,1.9],L_CROUCH.fl,L_CROUCH.bl);
    case 'jpunch':return P(0.3,strike?[1.22,0.05]:[1.2,1.6],[0.6,2.0],[1.1,-1.9],[0.45,-1.7],{hipH:96,jaw});
    case 'jkick':return P(0.04,[1.3,1.8],[0.7,2.0],strike?[1.28,-0.05]:[1.15,-1.95],[0.3,-1.9],{hipH:96,jaw});
    case 'wave':
      if(t<m.st*0.62)return P(-0.1,[0.35,2.35],[0.25,2.5],[0.58,-0.5],[-0.42,-0.1],{head:-.05});
      return P(0.26,[1.56,0.0],[1.47,0.1],[0.62,-0.45],[-0.46,-0.05],{jaw});
  }
  return P(0.1,A_GUARD.fa,A_GUARD.ba,L_STAND.fl,L_STAND.bl);
}
function autoHip(C,p){
  const fy=l=>C.thigh*Math.cos(l[0])+C.shin*Math.cos(l[0]+l[1]);
  return Math.max(fy(p.fl),fy(p.bl))+C.foot;
}
function lerpPose(f,tg,k){
  const c=f.pose;
  c.lean=lerp(c.lean,tg.lean,k);c.head=lerp(c.head,tg.head,k);c.rot=lerp(c.rot,tg.rot,k);c.jaw=lerp(c.jaw,tg.jaw,k);
  for(const n of ['fa','ba','fl','bl']){c[n][0]=lerp(c[n][0],tg[n][0],k);c[n][1]=lerp(c[n][1],tg[n][1],k);}
  const th=tg.hipH!=null?tg.hipH:autoHip(f.cfg,tg);
  c.hipH=lerp(c.hipH,th,k);
  if(f.grounded&&tg.hipH==null&&Math.abs(c.rot)<0.05)c.hipH=autoHip(f.cfg,c);
}

/* ================= 输入 ================= */
const keys=new Set(),touchKeys=new Set();
const MAP1={left:['KeyA'],right:['KeyD'],up:['KeyW','Space'],down:['KeyS'],punch:['KeyJ'],kick:['KeyK'],wave:['KeyL']};
const MAP2={left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],punch:['Numpad1','Comma','KeyB'],kick:['Numpad2','Period','KeyN_'],wave:['Numpad3','Slash']};
const MAP1X={left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],punch:['Numpad1','Comma'],kick:['Numpad2','Period'],wave:['Numpad3','Slash']};
function mapsFor(side){return side===0?(game.mode==='cpu'?[MAP1,MAP1X]:[MAP1]):[MAP2];}
function press(f,act){f.buf[act]=0.16;}
function readInput(){
  for(const f of fighters){
    if(f.isAI)continue;
    const ms=mapsFor(f.side),c=f.ctrl;
    for(const d of ['left','right','up','down'])c[d]=ms.some(m=>m[d].some(k=>keys.has(k)))||(f.side===0&&touchKeys.has(d));
  }
}
addEventListener('keydown',e=>{
  const code=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash'].includes(code))e.preventDefault();
  if(code==='KeyP'||code==='Escape'){if(!e.repeat&&game.phase!=='menu'&&game.phase!=='end')togglePause();return;}
  if(code==='KeyM'){if(!e.repeat)toggleMusic();return;}
  if(code==='KeyN'){if(!e.repeat)toggleSfx();return;}
  keys.add(code);
  if(e.repeat)return;
  for(const f of fighters){
    if(f.isAI)continue;
    for(const m of mapsFor(f.side))for(const a of ['punch','kick','wave'])if(m[a].includes(code))press(f,a);
  }
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());

/* ================= 战斗逻辑 ================= */
function setSt(f,s){if(f.st!==s){f.st=s;f.t=0;}}
function threatNear(f,o){
  if(o.st==='attack'&&o.move!=='wave'&&Math.abs(o.x-f.x)<270)return true;
  return projectiles.some(p=>p.owner===o&&Math.abs(p.x-f.x)<400&&Math.sign(f.x-p.x)===Math.sign(p.vx));
}
function startAttack(f,key){
  const m=MOVES[key];
  f.st='attack';f.move=key;f.t=0;f.moveHit=false;f.spawned=false;f.atkId=++atkCounter;
  if(m.air)f.airAtk=true;
  if(f.grounded)f.vx=(m.lunge||0)*f.facing;
  if(key==='wave'){f.cd=WAVE_CD;sfx('charge',f);}
  else sfx(m.heavy?'whooshH':'whoosh');
}
function updateFighter(f,o,dt,active){
  f.anim+=dt;f.t+=dt;f.cd=Math.max(0,f.cd-dt);f.inv=Math.max(0,f.inv-dt);f.flash=Math.max(0,f.flash-dt);
  for(const k in f.buf)f.buf[k]=Math.max(0,f.buf[k]-dt);
  if(!active){f.buf.punch=f.buf.kick=f.buf.wave=0;}
  const c=active?f.ctrl:NOCTRL,dir=f.facing;
  const fwd=dir>0?(c.right&&!c.left):(c.left&&!c.right);
  const back=dir>0?(c.left&&!c.right):(c.right&&!c.left);
  f.holdBack=back;
  if(f.grounded&&(f.st==='idle'||f.st==='walk'||f.st==='crouch'))f.facing=o.x>=f.x?1:-1;
  const free=f.grounded&&(f.st==='idle'||f.st==='walk'||f.st==='crouch');
  f.guard=free&&back&&threatNear(f,o);
  if(free){
    if(f.buf.wave>0&&f.cd<=0&&!projectiles.some(p=>p.owner===f)){f.buf.wave=0;startAttack(f,'wave');}
    else if(f.buf.punch>0){f.buf.punch=0;startAttack(f,c.down?'cpunch':'punch');}
    else if(f.buf.kick>0){f.buf.kick=0;startAttack(f,c.down?'ckick':'kick');}
    else if(c.up){f.st='jump';f.t=0;f.grounded=false;f.vy=-JUMP_V;f.vx=fwd?JUMP_VX*dir:back?-JUMP_VX*dir:0;f.airAtk=false;sfx('jump');}
    else if(c.down){setSt(f,'crouch');f.vx=0;}
    else if(fwd){setSt(f,'walk');f.vx=WALK_F*dir;}
    else if(back&&!f.guard){setSt(f,'walk');f.vx=-WALK_B*dir;}
    else{setSt(f,'idle');f.vx=0;}
    if(f.st==='walk')f.walkPh+=dt*(f.vx*dir>0?11:-9.5);
  }else if(f.st==='jump'){
    if(!f.airAtk&&(f.buf.punch>0||f.buf.kick>0)){const k=f.buf.kick>0?'jkick':'jpunch';f.buf.punch=f.buf.kick=0;const vx=f.vx,vy=f.vy;startAttack(f,k);f.vx=vx;f.vy=vy;}
  }else if(f.st==='attack'){
    const m=MOVES[f.move];
    if(f.grounded)f.vx=approach(f.vx,0,1700*dt);
    if(f.move==='wave'&&!f.spawned&&f.t>=m.st){f.spawned=true;spawnProjectile(f);}
    const end=m.st+m.ac+m.rc;
    if(f.grounded&&!m.air&&f.moveHit&&f.t>m.st+m.ac&&f.chain<2&&(f.buf.punch>0||f.buf.kick>0)){
      const k=f.buf.kick>0?(c.down?'ckick':'kick'):(c.down?'cpunch':'punch');f.buf.punch=f.buf.kick=0;f.chain++;startAttack(f,k);
    }else if(f.t>=end){
      if(m.air){if(!f.grounded){f.st='jump';f.t=0;}}
      else{f.st=c.down?'crouch':'idle';f.t=0;f.chain=0;}
    }
  }else if(f.st==='hit'||f.st==='block'){
    f.stun-=dt;f.vx=approach(f.vx,0,1500*dt);
    if(f.stun<=0){f.st=c.down?'crouch':'idle';f.t=0;}
  }else if(f.st==='knock'){
    if(f.grounded){f.vx=approach(f.vx,0,1400*dt);if(f.downed&&f.t>0.62){f.st='idle';f.t=0;f.inv=0.35;f.downed=false;}}
  }else if(f.st==='ko'){
    if(f.grounded)f.vx=approach(f.vx,0,1100*dt);
  }else if(f.st==='win'||f.st==='lose'){f.vx=approach(f.vx,0,1500*dt);}

  f.x+=f.vx*dt;
  if(!f.grounded){
    f.vy+=GRAV*dt;f.y+=f.vy*dt;
    if(f.y>=GROUND){f.y=GROUND;f.vy=0;f.grounded=true;onLand(f);}
  }
  f.x=clamp(f.x,50,STAGE_W-50);
  if(Math.abs(f.x-o.x)>MAXSEP)f.x=o.x+Math.sign(f.x-o.x)*MAXSEP;

  f.dmgT=Math.max(0,f.dmgT-dt);
  if(f.dmgT<=0)f.dispHp=approach(f.dispHp,f.hp,60*dt);
  const tg=poseTarget(f);
  lerpPose(f,tg,1-Math.exp(-dt*(f.st==='attack'||f.st==='hit'?42:26)));
}
function onLand(f){
  if(f.st==='jump'||(f.st==='attack'&&MOVES[f.move].air)){f.st='idle';f.t=0;f.vx=0;dust(f.x,6);sfx('land');}
  else if(f.st==='knock'){f.downed=true;f.t=0;dust(f.x,12);shake(5);sfx('thud');}
  else if(f.st==='ko'){dust(f.x,18);shake(8);sfx('thud');f.vx*=0.4;}
}
function hurtbox(f){
  if(f.st==='knock'||f.st==='ko'||f.inv>0)return null;
  if(!f.grounded)return{x:f.x-30,y:f.y-172,w:60,h:136};
  if(isCrouching(f))return{x:f.x-34,y:f.y-118,w:68,h:118};
  return{x:f.x-30,y:f.y-178,w:60,h:178};
}
function attackBox(f){
  if(f.st!=='attack')return null;
  const m=MOVES[f.move];
  if(!m.box||f.moveHit||f.t<m.st||f.t>m.st+m.ac)return null;
  const [ox,oy,w,h]=m.box;
  return{x:f.facing>0?f.x+ox:f.x-ox-w,y:f.y+oy,w,h};
}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function tryHit(a,b){
  const ab=attackBox(a);if(!ab)return;
  const hb=hurtbox(b);if(!hb||!overlap(ab,hb))return;
  a.moveHit=true;
  const px=(Math.max(ab.x,hb.x)+Math.min(ab.x+ab.w,hb.x+hb.w))/2, py=(Math.max(ab.y,hb.y)+Math.min(ab.y+ab.h,hb.y+hb.h))/2;
  applyHit(a,b,MOVES[a.move],px,py,null);
}
function applyHit(a,b,m,px,py,proj){
  const fromDir=proj?Math.sign(proj.vx):(b.x>=a.x?1:-1);
  const c=b.isAI||game.phase==='fight'||game.phase==='menu'?b.ctrl:NOCTRL;
  const holdAway=fromDir>0?(c.right&&!c.left):(c.left&&!c.right);
  const crouch=isCrouching(b);
  const canBlock=b.grounded&&['idle','walk','crouch','block'].includes(b.st)&&holdAway;
  const ok=crouch?m.hit!=='air':m.hit!=='low';
  if(canBlock&&ok){
    b.st='block';b.t=0;b.stun=m.stun*0.62;b.crouchStun=crouch;b.vx=fromDir*m.push*0.75;
    b.hp=Math.max(1,b.hp-m.chip);b.dmgT=0.5;
    spark(px,py,'#9fdcff',10,false);sfx('block');game.hitstop=Math.max(game.hitstop,.04);
    if(!proj&&(b.x<80||b.x>STAGE_W-80))a.vx=-fromDir*m.push*0.6;
    return 'block';
  }
  b.hp=Math.max(0,b.hp-m.dmg);b.flash=0.12;b.dmgT=0.55;
  if(game.phase==='menu'&&b.hp<30)b.hp=b.dispHp=100;
  if(b.hp<=0){knockout(b,a,fromDir);spark(px,py,'#fff2a8',26,true);return 'ko';}
  if(m.knock||!b.grounded){b.st='knock';b.t=0;b.downed=false;b.grounded=false;b.vy=-560;b.vx=fromDir*240;b.y=Math.min(b.y,GROUND-1);}
  else{b.crouchStun=crouch;b.st='hit';b.t=0;b.stun=m.stun;b.vx=fromDir*m.push;}
  b.move=null;
  if(!proj&&(b.x<80||b.x>STAGE_W-80))a.vx=-fromDir*m.push*0.6;
  spark(px,py,proj?proj.cfg.wave.core:'#fff2a8',m.heavy?18:12,m.heavy);
  sfx(proj?'boom':m.heavy?'heavy':'hit');
  game.hitstop=Math.max(game.hitstop,m.heavy?.09:.06);shake(m.heavy?9:5);
  return 'hit';
}
function knockout(b,a,dir){
  b.hp=0;b.st='ko';b.t=0;b.grounded=false;b.vy=-720;b.vx=dir*380;b.y=Math.min(b.y,GROUND-1);b.move=null;
  if(game.phase!=='fight'){return;}
  game.phase='ko';game.phaseT=0;game.result={winner:a,loser:b,reason:'ko'};
  game.timeScale=0.25;game.flash=0.4;game.flashCol='#fff';game.hitstop=0.14;shake(18);
  sfx('ko');playVoice('ko');duckMusic();
  banner('K.O.',3.2,'ko');
}
function spawnProjectile(f){
  projectiles.push({owner:f,cfg:f.cfg,x:f.x+f.facing*74,y:f.y-145,vx:f.facing*640,r:22,t:0,dead:false});
  sfx('fire',f);
  for(let i=0;i<10;i++)parts.push({x:f.x+f.facing*74,y:f.y-145,vx:f.facing*rand(80,300),vy:rand(-160,160),life:.35,max:.35,size:rand(3,6),color:f.cfg.wave.core,kind:'dot',add:true});
}
function updateProjectiles(dt,active){
  for(const p of projectiles){
    if(p.dead)continue;
    p.x+=p.vx*dt;p.t+=dt;
    if(Math.random()<0.8)parts.push({x:p.x-Math.sign(p.vx)*rand(10,26),y:p.y+rand(-14,14),vx:-p.vx*0.12,vy:rand(-40,40),life:.3,max:.3,size:rand(3,7),color:p.cfg.wave.mid+'1)',kind:'dot',add:true});
    if(active){
      const o=fighters.find(f=>f!==p.owner),hb=hurtbox(o);
      if(hb){
        const cx=clamp(p.x,hb.x,hb.x+hb.w),cy=clamp(p.y,hb.y,hb.y+hb.h);
        if((cx-p.x)**2+(cy-p.y)**2<p.r*p.r){p.dead=true;applyHit(p.owner,o,MOVES.wave,p.x,p.y,p);burst(p.x,p.y,p.cfg);}
      }
    }
    if(p.x<-60||p.x>STAGE_W+60||p.x<game.camX-200||p.x>game.camX+W+200)p.dead=true;
  }
  for(let i=0;i<projectiles.length;i++)for(let j=i+1;j<projectiles.length;j++){
    const a=projectiles[i],b=projectiles[j];
    if(!a.dead&&!b.dead&&a.owner!==b.owner&&Math.abs(a.x-b.x)<a.r+b.r&&Math.abs(a.y-b.y)<a.r+b.r){
      a.dead=b.dead=true;burst((a.x+b.x)/2,a.y,a.cfg);burst((a.x+b.x)/2,a.y,b.cfg);sfx('clash');shake(6);
    }
  }
  projectiles=projectiles.filter(p=>!p.dead);
}
function resolveBodies(a,b){
  if(a.st==='ko'||b.st==='ko'||a.st==='knock'||b.st==='knock')return;
  if(Math.abs(a.y-b.y)>110)return;
  const dx=b.x-a.x,min=62;
  if(Math.abs(dx)<min){
    const s=dx===0?(a.facing>0?1:-1):Math.sign(dx),push=(min-Math.abs(dx))/2;
    a.x-=s*push;b.x+=s*push;
    for(const f of [a,b]){if(f.x<50){const d=50-f.x;a.x+=d;b.x+=d;}if(f.x>STAGE_W-50){const d=f.x-(STAGE_W-50);a.x-=d;b.x-=d;}}
  }
}

/* ================= AI ================= */
const DIFF={easy:{think:[.35,.65],block:.22,dodge:.3,aggr:.45,wave:.22},normal:{think:[.2,.42],block:.5,dodge:.55,aggr:.6,wave:.35},hard:{think:[.1,.26],block:.8,dodge:.82,aggr:.76,wave:.45}};
function setPlan(f,plan,dur){const c=f.ctrl;c.left=!!plan.left;c.right=!!plan.right;c.up=!!plan.up;c.down=!!plan.down;f.ai.t=dur;}
function updateAI(f,o,dt){
  const ai=f.ai,D=DIFF[game.phase==='menu'?'normal':game.diff];
  ai.t-=dt;
  const dir=o.x>=f.x?1:-1,dist=Math.abs(o.x-f.x);
  const F=dir>0?'right':'left',B=dir>0?'left':'right';
  const pr=projectiles.find(p=>p.owner===o&&Math.sign(f.x-p.x)===Math.sign(p.vx)&&Math.abs(f.x-p.x)<360);
  if(pr&&ai.threat!==pr&&f.grounded){
    ai.threat=pr;
    if(Math.random()<D.dodge){const r=Math.random();setPlan(f,r<.5?{down:true}:r<.78?{up:true,[F]:dist<520}:{[B]:true},r<.5?.6:.3);return;}
  }
  if(o.st==='attack'&&o.move!=='wave'&&dist<210&&ai.seen!==o.atkId){
    ai.seen=o.atkId;
    if(Math.random()<D.block){setPlan(f,{[B]:true,down:MOVES[o.move].hit==='low'},.4);return;}
  }
  if(!f.grounded&&f.st==='jump'&&!f.airAtk&&dist<170&&f.vy>-300)press(f,Math.random()<.6?'kick':'punch');
  if(ai.t>0)return;
  let plan={},dur=rand(D.think[0],D.think[1]);const r=Math.random();
  if(o.st==='ko'||o.st==='knock'){setPlan(f,{},.3);return;}
  if(dist>470){
    if(f.cd<=0&&r<D.wave+.25){press(f,'wave');dur=.5;}else plan={[F]:true};
  }else if(dist>165){
    if(r<.12){plan={up:true,[F]:true};dur=.25;}
    else if(r<.12+D.wave*.6&&f.cd<=0){press(f,'wave');dur=.45;}
    else if(r<.78)plan={[F]:true};
    else if(r<.88)plan={[B]:true};
  }else{
    if(r<D.aggr){
      const q=Math.random();
      if(q<.34)press(f,'punch');else if(q<.66)press(f,'kick');else if(q<.84){plan={down:true};press(f,'kick');}else{plan={down:true};press(f,'punch');}
      dur=.26;
    }else if(r<D.aggr+.16){plan={[B]:true};dur=.3;}
    else if(r<D.aggr+.22){plan={up:true,[B]:true};dur=.25;}
    else plan={[B]:true,down:Math.random()<.4};
  }
  setPlan(f,plan,dur);
}

/* ================= 回合流程 ================= */
function banner(text,dur,style){game.banner={text,t:0,dur,style};}
function shake(v){game.shake=Math.max(game.shake,v);}
function resetFighters(){
  const ai=game.mode==='cpu';
  const c1=game.p1char,c2=c1==='human'?'lizard':'human';
  fighters=[makeFighter(c1,0),makeFighter(c2,1)];
  fighters[1].isAI=ai||game.phase==='menu';
  fighters[0].isAI=game.phase==='menu';
  projectiles=[];
}
function startMatch(mode){
  game.mode=mode;game.wins=[0,0];game.round=1;game.paused=false;
  showOverlay(null);startRound();
}
function startRound(){
  game.phase='intro';game.phaseT=0;game.timer=ROUND_TIME;game.flags={};game.result=null;game.timeScale=1;game.banner=null;
  resetFighters();parts=parts.filter(p=>p.kind==='amb');
  game.camX=(STAGE_W-W)/2;
}
function endRound(){
  const r=game.result;
  if(r&&r.winner)game.wins[r.winner.side]++;
  const done=game.wins[0]>=2||game.wins[1]>=2||game.round>=5;
  if(done){
    game.phase='end';game.phaseT=0;
    const w=game.wins[0]===game.wins[1]?null:(game.wins[0]>game.wins[1]?0:1);
    game.matchWinner=w;
    let txt,voice;
    if(w===null){txt='DRAW';voice='lose';}
    else if(game.mode==='cpu'){txt=w===0?'YOU WIN!':'YOU LOSE';voice=w===0?'win':'lose';}
    else{txt=`PLAYER ${w+1} WINS!`;voice='win';}
    banner(txt,99,'win');playVoice(voice);
    if(w!==null){const f=fighters[w];if(f.st!=='ko'){f.st='win';f.t=0;}if(f.cid==='lizard')sfx('roar');}
  }else{game.round++;startRound();}
}
function timeOver(){
  const [a,b]=fighters;
  game.phase='ko';game.phaseT=0;
  const w=a.hp===b.hp?null:(a.hp>b.hp?a:b);
  game.result={winner:w,loser:w?(w===a?b:a):null,reason:'time'};
  banner('TIME OVER',3,'time');sfx('bell');
  if(w){const l=game.result.loser;l.st='lose';l.t=0;}
}
function stepPhase(dt){
  game.phaseT+=dt;
  const F=game.flags;
  if(game.phase==='intro'){
    if(!F.a&&game.phaseT>0.35){F.a=true;const fin=game.round>=3;banner(fin?'FINAL ROUND':'ROUND '+game.round,1.15,'round');playVoice(fin?'r3':game.round===2?'r2':'r1');sfx('bell');}
    if(!F.b&&game.phaseT>1.55){F.b=true;game.phase='fight';banner('FIGHT!',0.9,'fight');playVoice('fight');}
  }else if(game.phase==='fight'){
    game.timer-=dt;
    if(game.timer<=0){game.timer=0;timeOver();}
  }else if(game.phase==='ko'){
    if(game.phaseT>1.1)game.timeScale=approach(game.timeScale,1,dt*2);
    const w=game.result&&game.result.winner;
    if(w&&game.phaseT>1.8&&w.grounded&&w.st!=='win'&&w.st!=='ko'&&w.st!=='knock'&&w.st!=='attack'){w.st='win';w.t=0;}
    if(game.phaseT>4.2)endRound();
  }else if(game.phase==='end'){
    if(!F.res&&game.phaseT>2.2){F.res=true;showResult();}
  }
}

/* ================= 主循环 ================= */
function step(dt){
  game.time+=dt;
  updateAmbient(dt);
  if(game.banner){game.banner.t+=dt;if(game.banner.t>game.banner.dur)game.banner=null;}
  game.flash=Math.max(0,game.flash-dt);
  game.shake=Math.max(0,game.shake-dt*40);
  if(game.paused)return;
  if(game.hitstop>0){game.hitstop-=dt;return;}
  if(game.phase!=='ko')game.timeScale=approach(game.timeScale,1,dt*3);
  const sdt=dt*game.timeScale;
  stepPhase(dt);
  readInput();
  const [a,b]=fighters;
  const active=game.phase==='fight'||game.phase==='menu';
  for(const f of fighters){if(f.isAI&&active)updateAI(f,f===a?b:a,sdt);}
  updateFighter(a,b,sdt,active);
  updateFighter(b,a,sdt,active);
  if(active){tryHit(a,b);tryHit(b,a);}
  resolveBodies(a,b);
  updateProjectiles(sdt,game.phase==='fight'||game.phase==='menu');
  updateParts(sdt);
  const target=clamp((a.x+b.x)/2-W/2,0,STAGE_W-W);
  game.camX=lerp(game.camX,target,1-Math.exp(-dt*6));
  const zt=game.phase==='ko'&&game.phaseT<1.4&&game.result&&game.result.reason==='ko'?1.12:1;
  game.zoom=lerp(game.zoom,zt,1-Math.exp(-dt*5));
}

/* ================= 粒子 ================= */
function spark(x,y,col,n,big){
  for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(big?260:180,big?720:520);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.14,.3),max:.3,size:rand(2,4),color:col,kind:'spark',add:true});}
  parts.push({x,y,vx:0,vy:0,life:.22,max:.22,size:big?70:44,color:col,kind:'ring',add:true});
  parts.push({x,y,vx:0,vy:0,life:.1,max:.1,size:big?60:36,color:'#ffffff',kind:'flash',add:true});
}
function burst(x,y,cfg){
  for(let i=0;i<26;i++){const a=rand(0,TAU),s=rand(120,520);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.5),max:.5,size:rand(3,8),color:cfg.wave.mid+'1)',kind:'dot',add:true});}
  parts.push({x,y,vx:0,vy:0,life:.35,max:.35,size:90,color:cfg.wave.core,kind:'ring',add:true});
}
function dust(x,n){
  for(let i=0;i<n;i++)parts.push({x:x+rand(-30,30),y:GROUND-rand(0,8),vx:rand(-160,160),vy:rand(-90,-20),life:rand(.35,.7),max:.7,size:rand(6,14),color:'rgba(200,180,130,',kind:'dust'});
}
function updateParts(dt){
  for(const p of parts){if(p.kind==='amb')continue;p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.kind==='spark'){p.vx*=0.9;p.vy=p.vy*0.9+500*dt;}else if(p.kind==='dust'){p.vx*=0.94;p.vy*=0.94;p.size+=dt*14;}else if(p.kind==='dot'){p.vx*=0.95;p.vy*=0.95;}}
  parts=parts.filter(p=>p.kind==='amb'||p.life>0);
}

/* ================= 环境动画 ================= */
const amb={leaves:[],motes:[],birds:[],birdT:4};
function initAmbient(){
  const r=mulberry32(77);
  for(let i=0;i<22;i++)amb.leaves.push({x:r()*W,y:r()*H,vx:rand(-20,20),vy:rand(30,70),rot:r()*TAU,vr:rand(-2,2),size:rand(7,14),ph:r()*TAU,col:['#6aa83a','#8cbf3f','#c9b63a','#4f8f35','#a8742a'][i%5]});
  for(let i=0;i<46;i++)amb.motes.push({x:r()*W,y:r()*H*0.9,ph:r()*TAU,s:rand(1,2.6),sp:rand(.3,1)});
}
function updateAmbient(dt){
  for(const l of amb.leaves){l.ph+=dt*2;l.x+=(l.vx+Math.sin(l.ph)*40)*dt;l.y+=l.vy*dt;l.rot+=l.vr*dt;
    if(l.y>H+20){l.y=-20;l.x=rand(0,W);}if(l.x<-30)l.x=W+20;if(l.x>W+30)l.x=-20;}
  for(const m of amb.motes){m.ph+=dt*m.sp;}
  amb.birdT-=dt;
  if(amb.birdT<=0){amb.birdT=rand(9,16);const d=Math.random()<.5?1:-1,y=rand(150,300);
    for(let i=0;i<rand(3,6);i++)amb.birds.push({x:d>0?-40-i*28:W+40+i*28,y:y+rand(-20,20)+i*6,vx:d*rand(90,120),ph:rand(0,TAU),s:rand(.7,1.1)});}
  for(const b of amb.birds){b.x+=b.vx*dt;b.ph+=dt*11;}
  amb.birds=amb.birds.filter(b=>b.x>-120&&b.x<W+120);
}

function makeLayer(f,h,y0){
  const w=Math.ceil(W+(STAGE_W-W)*f);
  const c=document.createElement('canvas');c.width=Math.ceil(w*RS);c.height=Math.ceil((h||H)*RS);
  const g=c.getContext('2d');g.scale(RS,RS);if(y0)g.translate(0,-y0);
  return{c,g,w,f,h:h||H,y0:y0||0};
}
function leafShape(g,x,y,ang,len,wid,col,vein){
  g.save();g.translate(x,y);g.rotate(ang);g.fillStyle=col;g.beginPath();g.moveTo(0,0);
  g.quadraticCurveTo(len*.45,-wid,len,0);g.quadraticCurveTo(len*.45,wid,0,0);g.fill();
  if(vein){g.strokeStyle=vein;g.lineWidth=Math.max(.8,wid*.12);g.beginPath();g.moveTo(0,0);g.lineTo(len*.95,0);g.stroke();}
  g.restore();
}
function frond(g,x,y,ang,len,col,bend,dens,vein){
  g.save();g.translate(x,y);g.rotate(ang);
  g.strokeStyle=col;g.lineWidth=Math.max(1.5,len*.018);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(len*.5,0,len,bend*len);g.stroke();

    leafShape(g,px,py,ta-1.05,ll,ll*.16,col,vein);leafShape(g,px,py,ta+1.05,ll,ll*.16,col,vein);}
  g.restore();
}
function bigLeaf(g,x,y,ang,len,col,vein){
  g.save();g.translate(x,y);g.rotate(ang);g.fillStyle=col;g.beginPath();g.moveTo(0,0);
  g.bezierCurveTo(len*.2,-len*.55,len*.85,-len*.35,len,0);g.bezierCurveTo(len*.85,len*.35,len*.2,len*.55,0,0);g.fill();

function blob(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
function foliage(g,x,y,r,c1,c2,rn){

/* ================= 角色绘制 ================= */
let OW=0;
const V=(x,y)=>({x,y}), vadd=(a,b,s=1)=>V(a.x+b.x*s,a.y+b.y*s), vlerp=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t));
function seg(a,b,w,c){ctx.strokeStyle=c;ctx.lineWidth=w+OW;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
function disc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r+OW/2,0,TAU);ctx.fill();}
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.fill();if(OW){ctx.strokeStyle=c;ctx.lineWidth=OW;ctx.stroke();}}
function limb(o,a1,l1,a2,l2){const k=V(o.x+Math.sin(a1)*l1,o.y+Math.cos(a1)*l1);const b=a1+a2;return[k,V(k.x+Math.sin(b)*l2,k.y+Math.cos(b)*l2)];}
function joints(f){
  const p=f.pose,C=f.cfg,hip=V(0,0);
  const up=V(Math.sin(p.lean),-Math.cos(p.lean)),n=V(Math.cos(p.lean),Math.sin(p.lean));
  const tor=vadd(hip,up,C.torso),sh=vadd(hip,up,C.torso*.9);
  const na=p.lean+p.head*.6;
  const headC=V(tor.x+Math.sin(na)*(C.neck+C.head*.85),tor.y-Math.cos(na)*(C.neck+C.head*.85));
  const [fk,ff]=limb(hip,p.fl[0],C.thigh,p.fl[1],C.shin),[bk,bf]=limb(hip,p.bl[0],C.thigh,p.bl[1],C.shin);
  const [fe,fh]=limb(sh,p.fa[0],C.upper,p.fa[1],C.fore),[be,bh]=limb(sh,p.ba[0],C.upper,p.ba[1],C.fore);
  return{hip,tor,sh,headC,na,fk,ff,bk,bf,fe,fh,be,bh,up,n};
}
function drawFighter(f){
  const p=f.pose,C=f.cfg;
  // 阴影
  const sc=clamp(1-(GROUND-f.y)/420,.35,1);
  ctx.fillStyle=`rgba(10,20,8,${.38*sc})`;ctx.beginPath();ctx.ellipse(f.x+(p.rot?-f.facing*40:0),GROUND+3,(p.rot<-1?80:48)*sc,9*sc,0,0,TAU);ctx.fill();

  ctx.save();
  ctx.translate(f.x,f.y-p.hipH);ctx.scale(f.facing,1);ctx.rotate(p.rot);
  ctx.lineCap='round';ctx.lineJoin='round';
  const body=f.cid==='human'?drawHuman:drawLizard;
  OW=5;body(f,J,C.palO,false);OW=0;
  body(f,J,f.flash>0?C.palW:C.pal,true);
  if(f.st==='attack'&&f.move==='wave'&&!f.spawned){
    const k=clamp(f.t/MOVES.wave.st,0,1),hx=(J.fh.x+J.bh.x)/2,hy=(J.fh.y+J.bh.y)/2;
    ctx.globalCompositeOperation='lighter';

  }
  ctx.restore();
}
function drawHuman(f,J,pal,detail){

  const leg=(k,ft,dark)=>{seg(hip,k,19,dark?pal.giD:pal.gi);seg(k,ft,16,dark?pal.giD:pal.gi);

function drawProjectile(p){

  let g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.6*pulse);g.addColorStop(0,c.outer+'.55)');g.addColorStop(1,c.outer+'0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.6*pulse,0,TAU);ctx.fill();

  else{for(let k=0;k<3;k++){const a=p.t*14+k*TAU/3;ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(p.x+Math.cos(a)*p.r*.7,p.y+Math.sin(a)*p.r*.7,4,0,TAU);ctx.fillStyle=c.core;ctx.fill();}}
  ctx.restore();
}
function drawParts(){
  for(const p of parts){
    if(p.kind==='amb')continue;
    const a=clamp(p.life/p.max,0,1);
    ctx.globalCompositeOperation=p.add?'lighter':'source-over';
    if(p.kind==='spark'){ctx.strokeStyle=p.color;ctx.globalAlpha=a;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();}
    else if(p.kind==='ring'){ctx.strokeStyle=p.color;ctx.globalAlpha=a;ctx.lineWidth=5*a+1;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.2-a),0,TAU);ctx.stroke();}
    else if(p.kind==='flash'){ctx.fillStyle=p.color;ctx.globalAlpha=a*.9;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.3-a*.6),0,TAU);ctx.fill();}

  const k=b.t,a=b.dur<50&&k>b.dur-.3?(b.dur-k)/.3:1,s=k<.18?2.4-1.4*(k/.18):1+Math.max(0,.04-(k-.18)*.04);
  const size=b.style==='ko'?220:b.style==='win'?110:b.style==='round'?100:b.style==='time'?100:150;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.translate(W/2+(b.style==='ko'&&k<.6?rand(-6,6):0),H*.4);ctx.scale(s,s);
  ctx.font=`900 ${size}px Impact,"Arial Black",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const g=ctx.createLinearGradient(0,-size/2,0,size/2);
  if(b.style==='ko'){g.addColorStop(0,'#fff6b0');g.addColorStop(.45,'#ff9a1f');g.addColorStop(1,'#d81e12');}
  else if(b.style==='fight'){g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#ffd23f');g.addColorStop(1,'#ff6a1f');}
  else{g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#e6f6c8');g.addColorStop(1,'#8ed14a');}
  ctx.lineJoin='round';ctx.lineWidth=size*.12;ctx.strokeStyle='#1a0904';ctx.strokeText(b.text,0,0);
  ctx.lineWidth=size*.05;ctx.strokeStyle='#fff3c8';ctx.strokeText(b.text,0,0);
  ctx.fillStyle=g;ctx.fillText(b.text,0,0);
  ctx.restore();
}

function draw(){
  ctx.setTransform(K,0,0,K,0,0);
  ctx.clearRect(0,0,W,H);
  const sh=game.shake,sx=sh?rand(-sh,sh):0,sy=sh?rand(-sh,sh)*.6:0;
  ctx.save();
  const z=game.zoom;ctx.translate(W/2,H*.62);ctx.scale(z,z);ctx.translate(-W/2+sx,-H*.62+sy);
  drawWorld();
  ctx.save();ctx.translate(-game.camX,0);
  drawLayer(BG.ground,0);
  const [a,b]=fighters;
  const order=(b.st==='attack'&&a.st!=='attack')?[a,b]:[b,a];
  for(const f of order)drawFighter(f);
  for(const p of projectiles)drawProjectile(p);
  drawParts();
  ctx.restore();
  drawForeground();
  ctx.restore();
  drawAmbientFront();
  if(game.phase!=='menu')drawHUD();
  drawBanner();
  if(game.flash>0){ctx.globalAlpha=clamp(game.flash/0.4,0,1)*.8;ctx.fillStyle=game.flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}

/* ================= 音频 ================= */
const AU={ctx:null,musicOn:true,sfxOn:true,voices:{},log:[]};
const MUSIC_VOL=0.5;
function initAudio(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const a=AU.ctx=new AC();
  AU.master=a.createGain();AU.master.gain.value=.9;
  const comp=a.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.25;
  AU.master.connect(comp);comp.connect(a.destination);
  AU.rev=a.createConvolver();AU.rev.buffer=makeImpulse(2.6,2.4);const ro=a.createGain();ro.gain.value=.5;AU.rev.connect(ro);ro.connect(AU.master);
  AU.music=a.createGain();AU.music.gain.value=AU.musicOn?MUSIC_VOL:0;AU.music.connect(AU.master);
  const ms=a.createGain();ms.gain.value=.28;AU.music.connect(ms);ms.connect(AU.rev);
  AU.sfx=a.createGain();AU.sfx.gain.value=AU.sfxOn?1:0;AU.sfx.connect(AU.master);
  AU.sfxRev=a.createGain();AU.sfxRev.gain.value=.35;AU.sfxRev.connect(AU.rev);
  AU.voice=a.createGain();AU.voice.gain.value=1.3;AU.voice.connect(AU.sfx);
  const vs=a.createGain();vs.gain.value=.45;AU.voice.connect(vs);vs.connect(AU.sfxRev);
  AU.noise=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=AU.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  decodeVoices();startMusic();startAmbience();
}
function makeImpulse(sec,decay){const a=AU.ctx,len=a.sampleRate*sec,b=a.createBuffer(2,len,a.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}return b;}
function decodeVoices(){
  const src=window.ANNOUNCER_VOICES;if(!src)return;
  for(const k in src){
    try{const bin=atob(src[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      const pr=AU.ctx.decodeAudioData(u.buffer,b=>{AU.voices[k]=b;},()=>{});if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}
  }
}
const VOICE_TEXT={ko:'K. O.!',fight:'Fight!',r1:'Round one!',r2:'Round two!',r3:'Final round!',win:'You win!',lose:'You lose!'};
function playVoice(key){
  AU.log.push('voice:'+key);
  if(!AU.ctx||!AU.sfxOn)return;
  const b=AU.voices[key];
  if(b){const s=AU.ctx.createBufferSource();s.buffer=b;s.connect(AU.voice);s.start();return;}
  try{const u=new SpeechSynthesisUtterance(VOICE_TEXT[key]);u.lang='en-US';u.rate=.9;u.pitch=.5;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function tone(type,f,t,d,dest,gain,a,f2,fd){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+(fd||d));o.connect(g);g.connect(dest);env(g,t,a||.005,gain,d);o.start(t);o.stop(t+(a||.005)+d+.05);return o;}
function noise(t,d,dest,gain,type,f,q,f2){const c=AU.ctx,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;fl.type=type;fl.frequency.setValueAtTime(f,t);
  if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q||1;s.connect(fl);fl.connect(g);g.connect(dest);env(g,t,.003,gain,d);s.start(t,Math.random()*1.5);s.stop(t+d+.05);}
function sfx(name,f){
  AU.log.push(name);
  if(!AU.ctx||!AU.sfxOn||game.phase==='menu')return;
  const t=AU.ctx.currentTime+.005,d=AU.sfx,r=AU.sfxRev;
  switch(name){
    case 'whoosh':noise(t,.11,d,.22,'bandpass',600,1.4,2600);break;
    case 'whooshH':noise(t,.16,d,.3,'bandpass',380,1.2,1800);break;
    case 'hit':tone('sine',190,t,.14,d,.85,.002,50);noise(t,.07,d,.6,'lowpass',3200,.8);tone('square',2400,t,.015,d,.08);break;
    case 'heavy':tone('sine',140,t,.24,d,1,.002,38);noise(t,.13,d,.75,'lowpass',2000,.8);noise(t,.08,d,.35,'bandpass',900,2);tone('triangle',70,t,.2,d,.4,.002,35);break;
    case 'block':tone('triangle',1500,t,.06,d,.25);tone('square',2150,t,.035,d,.07);noise(t,.07,d,.3,'highpass',4200,1);break;
    case 'jump':noise(t,.1,d,.1,'bandpass',900,1.5,2200);break;
    case 'land':tone('sine',110,t,.09,d,.35,.002,45);noise(t,.06,d,.18,'lowpass',500);break;
    case 'thud':tone('sine',90,t,.22,d,.7,.002,32);noise(t,.18,d,.45,'lowpass',600);break;
    case 'charge':
      if(f&&f.cid==='lizard'){noise(t,.32,d,.18,'highpass',3200,.7);tone('sawtooth',95,t,.3,d,.12,.05,70);}
      else{tone('sawtooth',220,t,.3,d,.08,.05,880);tone('sine',1320,t,.3,r,.06,.08,1980);}
      break;
    case 'fire':
      noise(t,.4,d,.5,'bandpass',3000,1,400);tone('sine',560,t,.32,d,.35,.003,120);
      if(f&&f.cid==='lizard'){tone('sawtooth',160,t,.3,d,.12,.01,60);noise(t,.3,r,.2,'highpass',2500);}else{tone('sine',900,t,.22,r,.14,.003,1400);}
      break;
    case 'boom':noise(t,.5,d,.85,'lowpass',1600,.8,200);tone('sine',95,t,.45,d,.9,.002,30);noise(t,.35,r,.3,'lowpass',1000);break;
    case 'clash':noise(t,.35,d,.6,'bandpass',2600,1.2,500);tone('sine',1300,t,.3,r,.25,.002,250);tone('sine',80,t,.3,d,.6,.002,30);break;
    case 'ko':{
      tone('sine',72,t,1.3,d,1.1,.002,24);noise(t,.8,d,.85,'lowpass',1000,.7,120);noise(t,.5,r,.5,'lowpass',2500);
      const base=98;[[1,.16,3.4],[1.48,.1,2.8],[2.09,.08,2.4],[2.56,.06,2],[3.14,.05,1.6],[4.2,.03,1.2]].forEach(([m,gn,dd])=>{tone('sine',base*m,t+.05,dd,d,gn,.004);tone('sine',base*m*1.003,t+.05,dd,r,gn*.8,.004);});
      break;}
    case 'bell':[[1,.16,1.2],[2.76,.07,.7],[5.4,.04,.4]].forEach(([m,gn,dd])=>{tone('sine',880*m,t,dd,d,gn,.002);tone('sine',880*m,t,dd,r,gn*.6,.002);});break;
    case 'roar':{const c=AU.ctx,o=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),g=c.createGain(),fl=c.createBiquadFilter();
      o.type='sawtooth';o.frequency.setValueAtTime(95,t);o.frequency.linearRampToValueAtTime(70,t+1.2);fl.type='lowpass';fl.frequency.value=700;
      lfo.frequency.value=17;lg.gain.value=25;lfo.connect(lg);lg.connect(o.frequency);o.connect(fl);fl.connect(g);g.connect(d);g.connect(r);env(g,t,.08,.35,1.2);
      o.start(t);lfo.start(t);o.stop(t+1.4);lfo.stop(t+1.4);noise(t,1.1,d,.18,'bandpass',800,1.5);break;}
    case 'click':tone('sine',880,t,.06,d,.15,.002,1320);break;
  }
}
function uiClick(){if(AU.ctx&&AU.sfxOn){const t=AU.ctx.currentTime;tone('sine',880,t,.06,AU.sfx,.15,.002,1320);}}
function duckMusic(){if(!AU.ctx||!AU.musicOn)return;const g=AU.music.gain,t=AU.ctx.currentTime;g.cancelScheduledValues(t);g.setTargetAtTime(MUSIC_VOL*.22,t,.04);g.setTargetAtTime(MUSIC_VOL,t+2.6,.7);}

/* --- 热带雨林背景音乐（程序生成） --- */
const BPM=104,STEP=60/BPM/4;
const mus={step:0,next:0,timer:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[{root:45,notes:[57,60,64]},{root:41,notes:[57,60,65]},{root:48,notes:[55,60,64]},{root:43,notes:[55,59,62]}];
const _=0;
const MEL_A=[69,_,72,_,76,_,72,74,_,76,_,79,76,_,74,_, 72,_,69,_,72,_,77,_,76,_,72,_,69,_,72,_, 67,_,72,_,76,_,79,_,76,_,72,_,74,_,76,_, 74,_,71,_,67,_,71,74,_,79,_,76,74,_,71,_];
const MEL_B=[81,_,_,79,76,_,79,_,81,_,84,_,81,79,76,_, 77,_,_,76,72,_,76,_,77,_,81,_,77,76,72,_, 76,_,79,_,84,_,79,76,_,72,_,76,79,_,_,_, 74,_,79,_,83,_,79,74,_,71,_,74,79,_,74,_];
const FLUTE=[[0,81,6],[6,79,2],[8,76,8],[16,77,6],[22,76,2],[24,72,8],[32,76,10],[42,79,6],[48,74,6],[54,71,2],[56,74,8]];
const BASS_PAT=[[0,0,3],[3,0,1],[6,7,2],[8,0,3],[11,7,1],[14,12,2]];
function startMusic(){mus.next=AU.ctx.currentTime+.15;mus.step=0;mus.timer=setInterval(schedMusic,25);}
function schedMusic(){const a=AU.ctx;if(!a||a.state!=='running')return;if(mus.next<a.currentTime-.2)mus.next=a.currentTime+.05;
  while(mus.next<a.currentTime+.15){playStep(mus.step,mus.next);mus.next+=STEP;mus.step++;}}
function playStep(s,t){
  const M=AU.music,st=s%16,bar=Math.floor(s/16)%4,loop=Math.floor(s/64),ch=CHORDS[bar],sec=loop%4;
  const intense=game.phase==='fight'&&fighters.some(f=>f.hp<35);
  // 鼓组：低音手鼓、拍击、康加、沙锤、木鱼
  if(st===0||st===7||st===10||(intense&&st===13)){tone('sine',112,t,.3,M,.55,.002,46);noise(t,.05,M,.12,'lowpass',300);}
  if(st===4||st===12){tone('sine',340,t,.08,M,.22,.001,210);noise(t,.05,M,.2,'bandpass',2100,1.2);}
  if([2,3,6,11,14,15].includes(st)&&(st!==15||loop%2)){const hi=st===3||st===11||st===15;tone('sine',hi?300:230,t,.12,M,.18,.002,hi?250:190);}
  noise(t,.04,M,st%2?.05:.03,'highpass',7000,1);
  const clave=bar%2===0?[0,3,6]:[4,8];if(clave.includes(st))tone('sine',1500,t,.035,M,.1,.001);
  // 贝斯
  for(const [bs,iv,len] of BASS_PAT)if(bs===st){const c=AU.ctx,o=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=mtof(ch.root+iv);
    fl.type='lowpass';fl.frequency.setValueAtTime(700,t);fl.frequency.exponentialRampToValueAtTime(220,t+STEP*len);o.connect(fl);fl.connect(g);g.connect(M);env(g,t,.008,.22,STEP*len);o.start(t);o.stop(t+STEP*len+.1);}
  // 和声垫
  if(st===0){const c=AU.ctx;for(const n of ch.notes){for(const dt of [-6,6]){const o=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=mtof(n);o.detune.value=dt;
    fl.type='lowpass';fl.frequency.value=950;o.connect(fl);fl.connect(g);g.connect(M);const dd=STEP*16;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.018,t+.5);g.gain.setValueAtTime(.018,t+dd-.4);g.gain.linearRampToValueAtTime(.0001,t+dd+.2);o.start(t);o.stop(t+dd+.3);}}}
  // 马林巴旋律
  const mel=(sec===1||sec===3)?MEL_B:MEL_A,m=mel[s%64];
  if(m){const f=mtof(m);tone('sine',f,t,.38,M,.15,.002);tone('sine',f*4,t,.06,M,.05,.001);tone('triangle',f*2,t,.12,M,.03,.002);}
  // 排箫（第三、四段）
  if(sec>=2)for(const [fs,n,len] of FLUTE)if(fs===s%64){const c=AU.ctx,o=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),g=c.createGain();o.type='triangle';o.frequency.value=mtof(n+12)/2;
    lfo.frequency.value=5.2;lg.gain.value=4;lfo.connect(lg);lg.connect(o.frequency);o.connect(g);g.connect(M);const dd=STEP*len;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.075,t+.07);g.gain.setValueAtTime(.065,t+dd-.05);g.gain.linearRampToValueAtTime(.0001,t+dd+.18);o.start(t);lfo.start(t);o.stop(t+dd+.25);lfo.stop(t+dd+.25);
    noise(t,dd*.6,M,.012,'bandpass',mtof(n)*2,3);}
}
/* --- 雨林环境声：虫鸣、鸟叫 --- */
function startAmbience(){
  const a=AU.ctx,s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),lfo=a.createOscillator(),lg=a.createGain();
  s.buffer=AU.noise;s.loop=true;fl.type='bandpass';fl.frequency.value=5200;fl.Q.value=7;g.gain.value=.03;lfo.frequency.value=11;lg.gain.value=.025;
  lfo.connect(lg);lg.connect(g.gain);s.connect(fl);fl.connect(g);g.connect(AU.music);s.start();lfo.start();
  const bird=()=>{
    if(AU.ctx.state==='running'){const t=AU.ctx.currentTime,M=AU.music,kind=Math.random();
      if(kind<.5){const n=2+Math.floor(Math.random()*3),b=2400+Math.random()*900;for(let i=0;i<n;i++)tone('sine',b,t+i*.11,.07,M,.06,.005,b*1.35);}
      else if(kind<.8){tone('sine',700,t,.18,M,.05,.03,1300);tone('sine',1250,t+.2,.25,M,.05,.03,650);}
      else{for(let i=0;i<3;i++)tone('triangle',420+i*30,t+i*.16,.13,M,.04,.02,760+i*40);}}
    setTimeout(bird,1800+Math.random()*4200);
  };
  setTimeout(bird,1200);
}

/* ================= UI ================= */
const $=s=>document.querySelector(s);
function showOverlay(id){for(const o of ['#menu','#pause','#result'])$(o).classList.remove('show');if(id)$(id).classList.add('show');}
function togglePause(){
  if(game.phase==='menu'||game.phase==='end')return;
  game.paused=!game.paused;showOverlay(game.paused?'#pause':null);
  if(AU.ctx){if(game.paused)AU.ctx.suspend();else AU.ctx.resume();}
}
function toggleMusic(){AU.musicOn=!AU.musicOn;if(AU.ctx){const g=AU.music.gain,t=AU.ctx.currentTime;g.cancelScheduledValues(t);g.setTargetAtTime(AU.musicOn?MUSIC_VOL:0,t,.05);}$('#btnMusic').classList.toggle('off',!AU.musicOn);}
function toggleSfx(){AU.sfxOn=!AU.sfxOn;if(AU.ctx)AU.sfx.gain.setTargetAtTime(AU.sfxOn?1:0,AU.ctx.currentTime,.02);$('#btnSfx').classList.toggle('off',!AU.sfxOn);}
function showResult(){
  const w=game.matchWinner;
  let title,sub;
  if(w===null){title='平局';sub='势均力敌，再战一场！';}
  else{const f=fighters[w];title=game.mode==='cpu'?(w===0?'你赢了！':'你输了…'):`玩家 ${w+1} 获胜！`;sub=`${f.cfg.cn} 以 ${game.wins[w]} : ${game.wins[1-w]} 拿下雨林之战`;}
  $('#resTitle').textContent=title;$('#resSub').textContent=sub;showOverlay('#result');
}
function goMenu(){game.phase='menu';game.paused=false;game.banner=null;showOverlay('#menu');if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();resetFighters();}
function bindUI(){
  document.querySelectorAll('.seg').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
      initAudio();uiClick();
      seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn));
      const opt=seg.dataset.opt,v=btn.dataset.v;if(opt==='char'){game.p1char=v;resetFighters();}else game.diff=v;
    }));
  });
  $('#btnCPU').addEventListener('click',()=>{initAudio();uiClick();startMatch('cpu');});
  $('#btn2P').addEventListener('click',()=>{initAudio();uiClick();startMatch('2p');});
  $('#btnResume').addEventListener('click',()=>togglePause());
  $('#btnQuit1').addEventListener('click',()=>{goMenu();});
  $('#btnQuit2').addEventListener('click',()=>{uiClick();goMenu();});
  $('#btnAgain').addEventListener('click',()=>{uiClick();startMatch(game.mode);});
  $('#btnMusic').addEventListener('click',()=>{initAudio();toggleMusic();});
  $('#btnSfx').addEventListener('click',()=>{initAudio();toggleSfx();});
  $('#btnPause').addEventListener('click',()=>togglePause());
  addEventListener('pointerdown',()=>initAudio(),{once:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&(game.phase==='fight'||game.phase==='intro')&&!game.paused)togglePause();});
  const touch=$('#touch');
  if('ontouchstart' in window||(window.matchMedia&&matchMedia('(pointer:coarse)').matches))touch.classList.add('show');
  touch.querySelectorAll('button').forEach(b=>{
    const k=b.dataset.k;
    const on=e=>{e.preventDefault();initAudio();b.classList.add('down');if(['punch','kick','wave'].includes(k)){if(fighters[0]&&!fighters[0].isAI)press(fighters[0],k);}else touchKeys.add(k);};
    const off=e=>{e.preventDefault();b.classList.remove('down');touchKeys.delete(k);};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
  });
}
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H),dpr=Math.min(2,devicePixelRatio||1);
  canvas.style.width=W*s+'px';canvas.style.height=H*s+'px';
  wrap.style.width=W*s+'px';wrap.style.height=H*s+'px';wrap.style.setProperty('--s',s.toFixed(4));
  K=s*dpr;canvas.width=Math.round(W*K);canvas.height=Math.round(H*K);
  const nrs=clamp(Math.ceil(K*2)/2,1,2);
  if(nrs!==RS||!BG){RS=nrs;buildBackground();}
}

let last=0;
function frame(now){
  const dt=Math.min(.05,last?(now-last)/1000:.016);last=now;
  step(dt);draw();
  requestAnimationFrame(frame);
}
function init(){
  resize();initAmbient();resetFighters();bindUI();
  addEventListener('resize',resize);
  requestAnimationFrame(frame);
}
init();
</script>
