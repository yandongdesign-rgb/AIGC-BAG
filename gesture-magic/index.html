<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>秘境召唤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#b98bff;--cyan:#7ef0ff;--ember:#ffad66;--ink:#05030c;--fg:#e9defc;--dim:rgba(233,222,252,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--fg);
  font-family:"Noto Serif SC","Songti SC","STSong",serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px 16px;text-align:center;z-index:10;
  background:radial-gradient(ellipse at 50% 45%,rgba(60,25,120,.55),rgba(5,3,12,.96) 65%);transition:opacity 1.2s}
#intro.gone{opacity:0;pointer-events:none}
.orb{position:relative;width:min(240px,56vw);aspect-ratio:1;margin-bottom:8px}
.orb i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(185,139,255,.55)}
.orb i:nth-child(1){border-style:dashed;animation:spin 22s linear infinite}
.orb i:nth-child(2){inset:12%;border-color:rgba(126,240,255,.45);border-width:2px;border-style:dotted;animation:spin 14s linear infinite reverse}
.orb i:nth-child(3){inset:26%;border-color:rgba(255,173,102,.4);animation:spin 9s linear infinite}
.orb i:nth-child(4){inset:41%;border:none;background:radial-gradient(circle,#fff 0,#d6b6ff 18%,rgba(150,80,255,.55) 40%,transparent 70%);
  animation:pulse 3.2s ease-in-out infinite}
.orb b{position:absolute;inset:0;display:grid;place-items:center;font-family:Cinzel,serif;font-size:min(13px,3vw);
  letter-spacing:.5em;color:var(--dim);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.25);filter:brightness(1.4)}}
h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:.35em;font-weight:700;padding-left:.35em;
  background:linear-gradient(180deg,#fff,#c9a8ff 60%,#7a52d6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(170,110,255,.6))}
h2{margin:0;font-family:Cinzel,serif;font-weight:400;font-size:clamp(11px,2.6vw,15px);letter-spacing:.5em;color:var(--dim)}
.lore{margin:10px 0 6px;line-height:2;color:var(--dim);font-size:15px;letter-spacing:.2em}
#go{margin-top:8px;padding:14px 46px;font-size:18px;letter-spacing:.5em;border-radius:999px;
  border:1px solid rgba(200,160,255,.7);background:linear-gradient(180deg,rgba(130,70,230,.35),rgba(40,15,90,.5));
  box-shadow:0 0 30px rgba(150,90,255,.45),inset 0 0 20px rgba(200,160,255,.25);transition:.3s}
#go:hover{box-shadow:0 0 50px rgba(170,110,255,.8),inset 0 0 26px rgba(220,190,255,.4);transform:translateY(-1px)}
.ghost{background:none;border:none;color:var(--dim);font-size:14px;letter-spacing:.15em;text-decoration:underline dotted;text-underline-offset:5px}
.ghost:hover{color:var(--fg)}
.note{margin:6px 0 0;font-size:12px;color:rgba(233,222,252,.38);letter-spacing:.1em}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none;transition:opacity .6s}
#brand{font-family:"Noto Serif SC",serif;letter-spacing:.5em;font-size:14px;color:var(--dim)}
#brand span{display:block;font-family:Cinzel,serif;letter-spacing:.35em;font-size:10px;margin-top:4px;opacity:.7}
#status{margin-top:8px;font-size:12px;letter-spacing:.15em;color:rgba(126,240,255,.7)}
#ctrl{display:flex;gap:8px;pointer-events:auto}
#ctrl button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(185,139,255,.35);
  background:rgba(20,10,40,.45);backdrop-filter:blur(6px);font-size:15px;opacity:.8}
#ctrl button.off{opacity:.35;text-decoration:line-through}
#spell{position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:4;text-align:center;pointer-events:none;opacity:0;white-space:nowrap}
#spell b{display:block;font-size:clamp(40px,9vw,84px);letter-spacing:.4em;padding-left:.4em;font-weight:700;color:#fff;
  text-shadow:0 0 12px var(--c,#b98bff),0 0 40px var(--c,#b98bff),0 0 80px var(--c,#b98bff)}
#spell i{display:block;font-style:normal;font-family:Cinzel,serif;letter-spacing:.7em;font-size:13px;margin-top:6px;color:var(--c,#b98bff)}
#spell.show{animation:incant 2.2s ease-out forwards}
@keyframes incant{0%{opacity:0;filter:blur(14px);transform:translateX(-50%) scale(1.25)}
  15%{opacity:1;filter:blur(0);transform:translateX(-50%) scale(1)}70%{opacity:.9}
  100%{opacity:0;filter:blur(6px);transform:translateX(-50%) scale(.96) translateY(-12px)}}
#grimoire{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;
  display:flex;gap:6px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none;padding:4px;transition:opacity .6s}
#grimoire::-webkit-scrollbar{display:none}
.rune{flex:0 0 auto;min-width:72px;padding:8px 10px 7px;border-radius:12px;text-align:center;
  border:1px solid rgba(185,139,255,.18);background:rgba(16,8,34,.5);backdrop-filter:blur(6px);transition:.25s;cursor:pointer}
.rune .e{font-size:20px;line-height:1.2}
.rune .n{font-size:12px;letter-spacing:.25em;margin-top:2px;padding-left:.25em}
.rune .k{font-size:9px;font-family:Cinzel,serif;color:var(--dim);letter-spacing:.15em;margin-top:2px}
.rune.on{border-color:var(--c);box-shadow:0 0 18px var(--c),inset 0 0 12px var(--c);background:rgba(40,18,80,.65);transform:translateY(-4px)}
.rune.sel{border-color:rgba(255,255,255,.55)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:6;padding:8px 16px;border-radius:999px;
  background:rgba(20,10,40,.75);border:1px solid rgba(185,139,255,.3);font-size:13px;letter-spacing:.1em;opacity:0;
  transition:opacity .5s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1}
body.hideui #hud,body.hideui #grimoire{opacity:0}
@media (max-width:560px){.rune{min-width:58px;padding:6px 6px}.rune .k{display:none}#brand span{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>

<div id="intro">
  <div class="orb"><i></i><i></i><i></i><i></i><b>✦ ARCANA ✦</b></div>
  <h1>秘境召唤</h1>
  <h2>MIJING · GESTURE SORCERY</h2>
  <p class="lore">以手为印，以光为咒<br>暗处的雷与火，已等你很久</p>
  <button id="go">唤 醒</button>
  <button id="mouseBtn" class="ghost">没有摄像头？以鼠标施法</button>
  <p class="note">建议佩戴耳机 · 需要摄像头与声音 · 手势识别完全在本地运行</p>
</div>

<div id="hud">
  <div><div id="brand">秘境召唤<span>GESTURE SORCERY</span></div><div id="status"></div></div>
  <div id="ctrl">
    <button id="bSound" title="声音 (M)">♪</button>
    <button id="bBones" title="手部骨骼 (B)">☍</button>
    <button id="bUI" title="隐藏界面 (H)">◐</button>
    <button id="bFull" title="全屏 (F)">⛶</button>
  </div>
</div>
<div id="spell"></div>
<div id="grimoire"></div>
<div id="toast"></div>

<script type="module">
/* =====================================================================
   秘境召唤 —— MediaPipe 手势 + Canvas 粒子 / 闪电 + Web Audio 程序化配乐
   ===================================================================== */
const CAM_ALLOWED = true;   // 在线沙箱版本会设为 false（仅触屏/鼠标施法）
const TOUCH = matchMedia('(pointer: coarse)').matches;
const TAU = Math.PI * 2;
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[(Math.random() * a.length) | 0];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const video = document.getElementById('v');
let W = 0, H = 0, DPR = 1, vignette = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.88)');
}
addEventListener('resize', resize); resize();

/* ---------------- 发光贴图 ---------------- */
function glow(r, g, b, s = 64) {
  const c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d'), h = s / 2, gr = x.createRadialGradient(h, h, 0, h, h, h);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.14, `rgba(${r},${g},${b},0.95)`);
  gr.addColorStop(0.42, `rgba(${r},${g},${b},0.28)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, s, s); return c;
}
const SPR = {
  white: glow(235, 240, 255), fire: glow(255, 150, 50), gold: glow(255, 215, 120), red: glow(255, 60, 25),
  violet: glow(165, 95, 255), magenta: glow(255, 85, 215), cyan: glow(90, 225, 255), blue: glow(110, 140, 255),
  smoke: glow(70, 35, 110, 128),
};
const fogSpr = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,255,255,0.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256); return c;
})();
const grain = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
  const d = x.createImageData(180, 180);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return ctx.createPattern(c, 'repeat');
})();
function spr(s, x, y, size, a) { ctx.globalAlpha = a; ctx.drawImage(s, x - size / 2, y - size / 2, size, size); }

/* ======================================================================
   AUDIO —— 全部程序化合成：暗黑氛围 drone + 风声 + 和弦 pad + 异域音阶钟声 + 心跳
   以及 火焰 / 滋滋电流 / 等离子嗡鸣 / 黑洞 / 蓄能 循环音与各种一次性音效
   ====================================================================== */
const SCALE = [293.66, 311.13, 369.99, 392, 440, 466.16, 523.25, 587.33]; // D 弗里几亚属音阶
const CHORDS = [[146.83, 174.61, 220, 329.63], [116.54, 146.83, 174.61, 220], [98, 146.83, 196, 233.08], [110, 138.59, 164.81, 233.08]];
const AU = {
  on: false, muted: false, energy: 0, lastZap: 0, lastSpark: 0, lastPop: 0,
  init() {
    if (this.on) return;
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = this.c = new C();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.2;
    this.master = c.createGain(); this.master.gain.value = 0.9; this.master.connect(comp); comp.connect(c.destination);
    this.rev = c.createConvolver(); this.rev.buffer = this.ir(4.5, 2.6);
    const rg = c.createGain(); rg.gain.value = 0.55; this.rev.connect(rg); rg.connect(this.master);
    this.dly = c.createDelay(1.5); this.dly.delayTime.value = 0.42;
    const fb = c.createGain(); fb.gain.value = 0.4; const dlf = c.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 2600;
    this.dly.connect(dlf); dlf.connect(fb); fb.connect(this.dly); dlf.connect(this.rev);
    const dg = c.createGain(); dg.gain.value = 0.45; dlf.connect(dg); dg.connect(this.master);
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0; this.musicBus.connect(this.master);
    this.musicBus.gain.setTargetAtTime(0.9, c.currentTime + 0.1, 2.5);
    this.sfxBus = c.createGain(); this.sfxBus.connect(this.master);
    this.noise = this.mkNoise();
    this.buildMusic(); this.buildLoops();
    this.on = true;
    setInterval(() => this.tick(), 90);
    c.resume && c.resume();
  },
  ir(d, dec) {
    const c = this.c, n = (c.sampleRate * d) | 0, b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const a = b.getChannelData(ch); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, dec); }
    return b;
  },
  mkNoise() {
    const c = this.c, n = c.sampleRate * 2, b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1; return b;
  },
  curve(k) { const n = 1024, a = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i / 512 - 1; a[i] = (1 + k) * x / (1 + k * Math.abs(x)); } return a; },
  send(node, bus, dry, wet = 0, dl = 0) {
    const c = this.c;
    if (dry) { const g = c.createGain(); g.gain.value = dry; node.connect(g); g.connect(bus); }
    if (wet) { const g = c.createGain(); g.gain.value = wet; node.connect(g); g.connect(this.rev); }
    if (dl) { const g = c.createGain(); g.gain.value = dl; node.connect(g); g.connect(this.dly); }
  },
  ns() { const s = this.c.createBufferSource(); s.buffer = this.noise; s.loop = true; return s; },
  osc(type, f) { const o = this.c.createOscillator(); o.type = type; o.frequency.value = f; return o; },
  filt(type, f, q = 1) { const b = this.c.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; },

  buildMusic() {
    const c = this.c, t = c.currentTime;
    // 低沉 drone
    const lp = this.droneLP = this.filt('lowpass', 240, 5);
    const lfo = this.osc('sine', 0.06), lg = c.createGain(); lg.gain.value = 130; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const dg = c.createGain(); dg.gain.value = 0.12; lp.connect(dg); this.send(dg, this.musicBus, 1, 0.5);
    [[36.71, 'sawtooth', 0], [36.71, 'sawtooth', 9], [73.42, 'sawtooth', -6], [110, 'triangle', 4], [55, 'sine', 0]]
      .forEach(([f, ty, d]) => { const o = this.osc(ty, f); o.detune.value = d; o.connect(lp); o.start(); });
    // 幽谷风声
    const n = this.ns(), bp = this.filt('bandpass', 520, 3);
    const wl = this.osc('sine', 0.045), wg2 = c.createGain(); wg2.gain.value = 360; wl.connect(wg2); wg2.connect(bp.frequency); wl.start();
    const wg = c.createGain(); wg.gain.value = 0.05; n.connect(bp); bp.connect(wg); this.send(wg, this.musicBus, 1, 0.7); n.start();
    this.nextChord = t + 0.5; this.nextBell = t + 2.5; this.nextBeat = t + 3; this.ci = 0;
  },
  tick() {
    if (!this.on) return;
    const t = this.c.currentTime, ahead = t + 0.3;
    while (this.nextChord < ahead) { this.chord(this.nextChord, CHORDS[this.ci++ % 4]); this.nextChord += 8; }
    while (this.nextBeat < ahead) { this.thump(this.nextBeat, 1); this.thump(this.nextBeat + 0.3, 0.6); this.nextBeat += 4.8 - this.energy * 1.6; }
    while (this.nextBell < ahead) {
      this.bell(this.nextBell, pick(SCALE) * (Math.random() < 0.3 ? 1 : 2), 0.03);
      this.nextBell += (Math.random() < 0.25 ? 0.21 : R(0.9, 2.8)) / (1 + this.energy * 1.5);
    }
  },
  chord(at, fs) {
    const c = this.c, lp = this.filt('lowpass', 950), g = c.createGain();
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.05, at + 3); g.gain.setValueAtTime(0.05, at + 7); g.gain.linearRampToValueAtTime(0, at + 11);
    lp.connect(g); this.send(g, this.musicBus, 0.6, 0.9);
    fs.forEach(f => [-7, 7].forEach(d => {
      const o = this.osc('triangle', f); o.detune.value = d; const og = c.createGain(); og.gain.value = 0.25;
      o.connect(og); og.connect(lp); o.start(at); o.stop(at + 11.2);
    }));
  },
  bell(at, f, v, bus) {
    const c = this.c, g = c.createGain();
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(v, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + 3);
    [[1, 1], [2.76, 0.35], [5.4, 0.12]].forEach(([m, a]) => {
      const o = this.osc('sine', f * m), og = c.createGain(); og.gain.value = a; o.connect(og); og.connect(g); o.start(at); o.stop(at + 3.1);
    });
    this.send(g, bus || this.musicBus, 0.5, 0.9, 0.6);
  },
  thump(at, v) {
    const c = this.c, o = this.osc('sine', 70), g = c.createGain();
    o.frequency.setValueAtTime(70, at); o.frequency.exponentialRampToValueAtTime(32, at + 0.35);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.32 * v, at + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.55);
    o.connect(g); this.send(g, this.musicBus, 1, 0.25); o.start(at); o.stop(at + 0.6);
  },
  buildLoops() {
    const c = this.c;
    const mk = (node, dry, wet) => { const g = c.createGain(); g.gain.value = 0; node.connect(g); this.send(g, this.sfxBus, dry, wet); return g; };
    { // 火焰低吼
      const n = this.ns(), lp = this.fireF = this.filt('lowpass', 900), hp = this.filt('highpass', 120);
      n.connect(lp); lp.connect(hp); this.fireG = mk(hp, 1, 0.3); n.start();
    }
    { // 滋滋电流：高频带通噪声（快速随机门控）+ 失真蜂鸣
      const n = this.ns(), bp = this.sizF = this.filt('bandpass', 4500, 0.9);
      n.connect(bp); this.sizG = mk(bp, 1, 0.25); n.start();
      const o1 = this.buzzO = this.osc('sawtooth', 100), o2 = this.osc('square', 150.7), mg = c.createGain(); mg.gain.value = 0.5;
      const ws = c.createWaveShaper(); ws.curve = this.curve(40); const f = this.filt('bandpass', 1300, 0.7);
      o1.connect(mg); o2.connect(mg); mg.connect(ws); ws.connect(f); this.buzzG = mk(f, 1, 0.2); o1.start(); o2.start();
    }
    { // 等离子嗡鸣
      const o = this.osc('sawtooth', 55), o2 = this.osc('sine', 110.5), lp = this.humF = this.filt('lowpass', 420, 8);
      o.connect(lp); o2.connect(lp); this.humG = mk(lp, 1, 0.4); o.start(); o2.start();
    }
    { // 黑洞涡流
      const n = this.ns(), lp = this.vorF = this.filt('lowpass', 300, 12), o = this.osc('sine', 38), og = c.createGain(); og.gain.value = 0.5;
      n.connect(lp); this.vorG = mk(lp, 1, 0.5); o.connect(og); og.connect(this.vorG); n.start(); o.start();
    }
    { // 蓄能上升音
      const o = this.osc('sawtooth', 80), o2 = this.osc('sine', 160), lp = this.chgF = this.filt('lowpass', 800, 4);
      o.connect(lp); o2.connect(lp); this.chgG = mk(lp, 1, 0.4); this.chgO = [o, o2]; o.start(); o2.start();
    }
  },
  frame(L) {
    if (!this.on) return;
    const t = this.c.currentTime, S = (p, v, tc) => p.setTargetAtTime(v, t, tc);
    this.energy += (L.energy - this.energy) * 0.02;
    S(this.droneLP.frequency, 240 + this.energy * 520, 0.6);
    S(this.fireG.gain, L.fire * (0.1 + Math.min(L.fireSpd, 1) * 0.28), 0.06);
    S(this.fireF.frequency, 500 + Math.min(L.fireSpd, 1) * 2600, 0.06);
    // 滋滋：每帧随机门控，产生不规则的噼啪电流声

    } else {
      let s = p.shrink ? p.size * (0.3 + 0.7 * a) : p.size, al = Math.min(1, a * 1.4) * p.alpha, sp = p.spr;
      if (p.fire) { sp = a > 0.7 ? SPR.gold : a > 0.4 ? SPR.fire : SPR.red; s = p.size * (0.4 + 0.6 * a); }
      if (p.flick) al *= 0.55 + 0.45 * Math.random();
      spr(sp, p.x, p.y, s, al);
    }
  }
  // —— 核心体：火球 / 蓄能 / 等离子 / 黑洞 ——
  for (const f of fireballs) {
    spr(SPR.fire, f.x, f.y, 130 * f.s, 0.85); spr(SPR.gold, f.x, f.y, 62 * f.s, 1); spr(SPR.white, f.x, f.y, 28 * f.s, 1);
    ctx.globalAlpha = 0.8; ctx.strokeStyle = 'rgb(255,200,120)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) { const st = T * (3 + i) + i * 2; ctx.beginPath(); ctx.arc(f.x, f.y, (20 + i * 7) * f.s, st, st + 1.4 + i * 0.3); ctx.stroke(); }
  }
  for (const c of charges) {
    const pul = 1 + Math.sin(T * (8 + c.c * 20)) * 0.12, r = (30 + c.c * 70) * pul;
    spr(SPR.magenta, c.x, c.y, r * 3, 0.6); spr(SPR.violet, c.x, c.y, r * 1.8, 0.9); spr(SPR.white, c.x, c.y, r * 0.6, 0.9);
    sigil(c.x, c.y, r * 1.5, -T * 2.5, 0.25 + c.c * 0.5, '#ff9cf0');
  }
  if (plasma.e > 0.01) {
    const { x, y } = plasma, r = plasma.r * Math.min(1, plasma.e + 0.2);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 7);
    g.addColorStop(0, 'rgba(200,110,255,0.28)'); g.addColorStop(1, 'rgba(160,80,255,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(x - r * 7, y - r * 7, r * 14, r * 14);
    spr(SPR.violet, x, y, r * 5, 0.75); spr(SPR.magenta, x, y, r * 2.8, 0.85); spr(SPR.white, x, y, r * 1.3, 0.95);
    ctx.lineWidth = 1.2;
    for (let q = 0; q < 4; q++) {
      ctx.globalAlpha = 0.55; ctx.strokeStyle = q % 2 ? 'rgb(255,150,255)' : 'rgb(170,140,255)'; ctx.beginPath();
      for (let i = 0; i <= 28; i++) { const an = i / 28 * TAU, rr = r * R(0.85, 1.2); i ? ctx.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr) : ctx.moveTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); }
      ctx.stroke();
    }
    sigil(x, y, r * 2.2, T * 0.8, 0.3 * Math.min(1, plasma.e), '#e3b6ff');
  }
  for (const v of vortices) {
    const s = v.scale;
    spr(SPR.violet, v.x, v.y, 260 * s, 0.55);
    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createRadialGradient(v.x, v.y, 0, v.x, v.y, 48 * s);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.6, 'rgba(0,0,0,0.95)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(v.x, v.y, 48 * s, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgb(255,225,255)'; ctx.lineWidth = 2; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(v.x, v.y, 27 * s, 0, TAU); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const st = -T * (2 + i * 0.7) + i; ctx.strokeStyle = i % 2 ? 'rgb(120,220,255)' : 'rgb(190,130,255)';
      ctx.globalAlpha = 0.6; ctx.lineWidth = 3 - i * 0.5; ctx.beginPath(); ctx.arc(v.x, v.y, (36 + i * 12) * s, st, st + 2.2); ctx.stroke();
    }
  }
  // —— 闪电 ——
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const b of B) {
    const a = (b.life / b.max) * (0.5 + 0.5 * Math.random());
    for (const [wm, al, col] of [[7, 0.07, b.c], [3, 0.25, b.c], [1, 0.95, '255,255,255']]) {
      ctx.strokeStyle = `rgb(${col})`; ctx.globalAlpha = al * a;
      ctx.lineWidth = b.w * wm; strokePts(b.pts);
      ctx.lineWidth = b.w * wm * 0.55; for (const br of b.br) strokePts(br);
    }
  }
  // —— 冲击波 ——
  for (const r of RINGS) {
    const a = r.life / r.max; ctx.globalAlpha = a; ctx.strokeStyle = `rgb(${r.c})`; ctx.lineWidth = r.w * a + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  // —— 暗角、闪光、胶片颗粒 ——
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (flash > 0.01) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = flash * 0.42; ctx.fillStyle = `rgb(${flashCol})`; ctx.fillRect(0, 0, W, H); }
  flash *= Math.pow(0.86, k);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07; ctx.fillStyle = grain;
  ctx.save(); ctx.translate(R(-90, 0), R(-90, 0)); ctx.fillRect(0, 0, W + 90, H + 90); ctx.restore();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

/* ======================================================================
   UI & 启动
   ====================================================================== */
const statusEl = document.getElementById('status'), toastEl = document.getElementById('toast');
let lastStatus = '';
function setStatus(s) { if (s !== lastStatus) { lastStatus = s; statusEl.textContent = s; } }
let toastTimer = 0;
function toast(s, ms = 4000) { toastEl.textContent = s; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms); }

const grim = document.getElementById('grimoire');
for (const g of ['POINT', 'PEACE', 'ROCK', 'OPEN', 'FIST', 'PINCH', 'TWIN']) {
  const s = SPELLS[g], el = document.createElement('div');
  el.className = 'rune'; el.style.setProperty('--c', s[3]);
  el.innerHTML = `<div class="e">${s[2]}</div><div class="n">${s[0]}</div><div class="k">${s[1]}</div>`;
  el.title = `${s[0]} · ${s[1]}${g === 'FIST' ? '（握拳蓄力，张开手掌释放星爆）' : g === 'TWIN' ? '（双手食指相对凝聚，张开手掌引爆）' : ''}`;
  el.onclick = () => { if (mode === 'mouse') { mouse.sel = g; activeKey = ''; } };
  grim.appendChild(el); runeEls[g] = el;
}

async function startCam() {
  setStatus('开启灵视之眼……');
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
  video.srcObject = stream; await video.play();
  mode = 'cam';
  setStatus('召唤手势之灵（加载模型）……');
  const bases = ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14', 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14'];
  let vision = null, base = null;
  for (const b of bases) { try { vision = await import(`${b}/vision_bundle.mjs`); base = b; break; } catch (e) { console.warn('load fail', b, e); } }
  if (!vision) throw new Error('无法加载 MediaPipe 手势库');
  const fs = await vision.FilesetResolver.forVisionTasks(`${base}/wasm`);
  const opts = d => ({ baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: d }, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
  try { lmk = await vision.HandLandmarker.createFromOptions(fs, opts('GPU')); }
  catch (e) { console.warn('GPU delegate failed, fallback CPU', e); lmk = await vision.HandLandmarker.createFromOptions(fs, opts('CPU')); }
  toast('👆 食指=焚星　✌️=星尘　🤘=雷殛（四处放电）　✊蓄力→✋星爆　👌=黑渊　双手食指相对=紫晶核', 9000);
}
function startMouse(msg) {
  mode = 'mouse'; activeKey = '';
  setStatus(TOUCH ? '触屏施法 · 点下方符文切换' : '鼠标施法 · 1–7 切换法术 · 按住蓄力 松开星爆');
  toast(msg || (TOUCH ? '手指在屏幕上滑动施法 · 点下方符文切换法术 · 长按蓄力，松手释放星爆' : '移动鼠标施法 · 数字键 1–7 或点击下方符文切换 · 按住鼠标蓄力，松开释放星爆'), 7000);
}
async function begin(useCam) {
  AU.init();
  document.getElementById('intro').classList.add('gone');
  if (!useCam) return startMouse();
  try { await startCam(); }
  catch (e) { console.error(e); startMouse('⚠ 摄像头或手势模型不可用（' + (e.message || e.name) + '），已切换为鼠标施法'); }
}
document.getElementById('go').onclick = () => begin(CAM_ALLOWED);
document.getElementById('mouseBtn').onclick = () => begin(false);
if (!CAM_ALLOWED) {
  document.getElementById('mouseBtn').hidden = true;
  document.querySelector('#intro .note').textContent = (TOUCH ? '手指滑动施法 · 长按蓄力松手星爆' : '鼠标施法 · 按住蓄力松开星爆') + ' · 建议戴耳机 · 摄像头手势版见项目说明';
}

cv.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('pointerdown', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = true; });
addEventListener('pointerup', () => { if (mouse.down) { mouse.down = false; mouse.openUntil = T + 0.9; } });

const bSound = document.getElementById('bSound'), bBones = document.getElementById('bBones');
const toggleSound = () => { AU.mute(!AU.muted); bSound.classList.toggle('off', AU.muted); };
const toggleBones = () => { showBones = !showBones; bBones.classList.toggle('off', !showBones); };
const toggleUI = () => document.body.classList.toggle('hideui');
const toggleFull = () => { try { const r = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); r?.catch?.(() => toast('当前环境不支持全屏')); } catch (e) { toast('当前环境不支持全屏'); } };
bSound.onclick = toggleSound; bBones.onclick = toggleBones; document.getElementById('bUI').onclick = toggleUI; document.getElementById('bFull').onclick = toggleFull;
const KEYMAP = { 1: 'POINT', 2: 'PEACE', 3: 'ROCK', 4: 'OPEN', 5: 'FIST', 6: 'PINCH', 7: 'TWIN' };
addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (key === 'm') toggleSound(); else if (key === 'b') toggleBones(); else if (key === 'h') toggleUI(); else if (key === 'f') toggleFull();
  else if (KEYMAP[key] && mode === 'mouse') { mouse.sel = KEYMAP[key]; activeKey = ''; }
});
document.addEventListener('visibilitychange', () => { if (AU.on) document.hidden ? AU.c.suspend() : AU.c.resume(); });

// 测试钩子
window.__arcanum = { HS, P, B, plasma, mouse, get mode() { return mode; } };
requestAnimationFrame(frame);
