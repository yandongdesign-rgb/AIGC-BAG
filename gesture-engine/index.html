<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETHER / 手势粒子实验室</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="stage" aria-label="实时粒子交互画布"></canvas>
<header><a class="brand" href="./">✳ ETHER<span>INTERACTION LAB / 01</span></a><div class="live">本地实时引擎 <i></i></div><button id="fullscreen">全屏体验</button></header>
<main><section class="intro"><div class="eyebrow">GESTURE-REACTIVE PARTICLE ENGINE</div><h1>让动作，<br>成为宇宙。</h1><p>手掌之间，唤醒光、引力与声场。<br>一个由你掌控的微型宇宙。</p><button id="camera" class="primary">开启摄像头 <span>◎</span></button><div id="message" role="status">当前为演示模式 · 移动鼠标改变引力中心</div></section>
<aside><div class="panel-head">控制台 <span>LIVE CONTROLS</span></div><label>输入源<select id="source"><option value="demo">交互演示</option><option value="camera">摄像头手势</option></select></label><label>粒子密度 <output id="densityValue">28,000</output><input id="density" type="range" min="7000" max="56000" step="1000" value="28000"></label><label>声场音量 <output id="volumeValue">35%</output><input id="volume" type="range" min="0" max="100" value="35"></label><button id="audio">开启合成音效</button><label>色彩主题<select id="theme"><option value="0">极光 / Aurora</option><option value="1">熔金 / Solar</option><option value="2">冰川 / Glacier</option></select></label><label class="check"><input id="preview" type="checkbox"> 显示摄像头与骨架</label><div class="capture"><button id="snapshot">截图</button><button id="record">录制 10 秒</button></div><small>数字键 1–6 切换演示 · 0 回到待机</small></aside>
<section class="gesture-dock"><div class="dock-title">选择一种能量 <span>在演示模式中探索手势</span><button id="autoplay">自动巡演</button></div><div id="gestures"></div></section></main>
<footer><div><i></i><span id="state">漩涡 · 拇指捏合</span><span id="hands">DEMO / 模拟输入</span></div><div><b id="fps">—</b> FPS <em></em><b id="latency">—</b> ms 推理 <em></em><span id="particleCount">28K</span> 粒子</div></footer>
<div id="monitor" hidden><video id="video" autoplay playsinline muted></video><canvas id="skeleton"></canvas></div><script type="module" src="src/app.js"></script></body></html>
