<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>逐风剑客 · 林间试炼</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07151f;color:#ecf5ed;font-family:system-ui,'Microsoft YaHei',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:absolute;top:24px;left:32px;right:32px;display:flex;justify-content:space-between;pointer-events:none}.brand{letter-spacing:4px;font-size:22px;font-weight:800}.sub{font-size:14px;color:#92b4b4;letter-spacing:2px;margin-top:6px}.stats{text-align:right;font-size:17px}#hp{color:#ff967e;letter-spacing:6px;margin-top:8px}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06141c80;backdrop-filter:blur(5px)}.card{max-width:560px;padding:36px;text-align:center;background:#102a31ed;border:1px solid #52766b;border-radius:24px;margin:20px;box-shadow:0 25px 100px #0006}h1{font-size:42px;margin:12px 0;color:#e5efbf}p{line-height:1.9;color:#b7cbca}button{font:inherit;color:#102324;background:#d6eda2;border:0;border-radius:12px;padding:13px 25px;font-weight:750;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}.help{position:absolute;bottom:24px;left:32px;color:#abc3c0;font-size:14px;pointer-events:none}#pause{position:absolute;right:32px;top:100px;background:#17373c;color:#d9e5d9;padding:9px 16px}.touch{position:absolute;bottom:24px;right:25px;display:flex;gap:10px}.touch button{padding:16px;background:#234448bb;color:white;border:1px solid #75958a;touch-action:none;user-select:none}.hidden{display:none!important}@media(max-width:650px){.hud{left:18px;right:18px;top:18px}.brand{font-size:18px}.sub{font-size:12px}.help{bottom:95px;left:18px;font-size:12px}.touch{left:18px;right:18px;justify-content:space-between}.touch button{padding:13px 17px}h1{font-size:32px}#pause{right:18px;top:88px}}
</style>
<canvas id="game" aria-label="逐风剑客，使用方向键移动，空格跳跃，下方向键下蹲，J挥剑"></canvas>
<div class="hud"><div><div class="brand">逐风剑客</div><div class="sub">林间试炼 / WINDWALKER</div></div><div class="stats"><span id="stage"></span><div id="hp"></div><div id="score" class="sub"></div></div></div>
<button id="pause" class="hidden">暂停 P</button>
<div class="help">A D / ← → 移动　空格 / W 跳跃　S / ↓ 下蹲　J 挥剑　P 暂停</div>
<div class="touch"><button data-key="left" aria-label="向左">左</button><button data-key="right" aria-label="向右">右</button><button data-key="duck">下蹲</button><button data-key="jump">跳跃</button><button data-key="attack">挥剑</button></div>
<div class="panel" id="overlay"><div class="card"><div class="sub">横版动作闯关 · 三重试炼</div><h1 id="title">风起，拔剑。</h1><p id="message">穿过幽林、暮色峡谷与月下古堡。<br>跳过尖刺，下蹲躲箭，挥剑击败守卫。<br>清除全部敌人，即可抵达发光的终点。</p><button id="start">开始冒险</button></div></div>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);
let W=1280,H=720,scale=1,mode='menu',level=0,kills=0,time=0,camera=0,last=0,shake=0,player,enemies,arrows,particles,spikes,archers;
const keys={}, names=['翡翠幽林','暮色峡谷','月下古堡'],lengths=[2700,3200,3700],ground=560;
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;W=1280;H=720;scale=Math.min(canvas.width/W,canvas.height/H)}addEventListener('resize',resize);resize();
function init(n=0){level=n;camera=0;arrows=[];particles=[];spikes=[800,1550,2250,...(n>0?[2850]:[])].filter(x=>x<lengths[n]-220).map(x=>({x,w:65}));enemies=Array.from({length:4+n*2},(_,i)=>({x:500+i*(lengths[n]-850)/(3+n*2),y:ground,hp:n===2?3:2,cd:0,hit:0,home:500+i*(lengths[n]-850)/(3+n*2)}));archers=[1100,1900,...(n>0?[2600]:[])];player={x:90,y:ground,vx:0,vy:0,hp:5,facing:1,duck:false,attack:0,cooldown:0,inv:0,grounded:true,buffer:0};mode='play';$('#overlay').classList.add('hidden');$('#pause').classList.remove('hidden');updateHUD()}
function updateHUD(){$('#stage').textContent=`${level+1} / 3　${names[level]}`;$('#hp').textContent='♥'.repeat(player?.hp||5)+'♡'.repeat(5-(player?.hp||5));$('#score').textContent=`击败 ${kills}　·　剩余敌人 ${enemies?.filter(e=>e.hp>0).length||0}`}
function panel(title,message,label){$('#title').textContent=title;$('#message').innerHTML=message;$('#start').textContent=label;$('#overlay').classList.remove('hidden')}
$('#start').onclick=()=>{if(mode==='pause'){mode='play';$('#overlay').classList.add('hidden')}else if(mode==='clear')init(level+1);else{kills=0;init()}};
function pause(){if(mode==='play'){mode='pause';panel('歇一口气。','剑还在，旅途也在。','继续冒险')}else if(mode==='pause'){mode='play';$('#overlay').classList.add('hidden')}}$('#pause').onclick=pause;
const mapping={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowDown:'duck',s:'duck',' ':'jump',w:'jump',ArrowUp:'jump',j:'attack'};
function press(key){keys[key]=true;if(mode==='play'&&key==='jump')player.buffer=.14;if(mode==='play'&&key==='attack'&&player.cooldown<=0){player.attack=.26;player.cooldown=.38;player.swing=new Set()}}
addEventListener('keydown',e=>{let key=mapping[e.key]||mapping[e.key.toLowerCase()];if(key){e.preventDefault();if(!e.repeat)press(key)}if(e.key.toLowerCase()==='p'&&!e.repeat)pause()});addEventListener('keyup',e=>{keys[mapping[e.key]||mapping[e.key.toLowerCase()]]=false});addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);if(mode==='play')pause()});
document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(b.dataset.key)};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.key]=false});
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:-Math.random()*240,life:.6,color})}
function damage(){if(player.inv>0)return;player.hp--;player.inv=1.25;shake=.2;burst(player.x,player.y-35,'#ff9c78');updateHUD();if(player.hp<=0){mode='dead';panel('剑客，重新出发。',`本次击败 ${kills} 名守卫。<br>留意低空箭矢，下蹲时仍能缓慢移动和挥剑。`,'重新挑战')}}
function step(dt){time+=dt;if(mode!=='play')return;const p=player;for(const k of ['inv','attack','cooldown','buffer'])p[k]=Math.max(0,p[k]-dt);shake=Math.max(0,shake-dt);p.duck=keys.duck&&p.grounded;let axis=(keys.right?1:0)-(keys.left?1:0);p.vx=axis*(p.duck?120:290);if(axis)p.facing=axis;if(p.buffer>0&&p.grounded&&!p.duck){p.vy=-650;p.grounded=false;p.buffer=0;burst(p.x,p.y,'#b5d59e',6)}p.x=Math.max(25,Math.min(lengths[level]-40,p.x+p.vx*dt));p.vy+=1700*dt;p.y+=p.vy*dt;if(p.y>=ground){p.y=ground;p.vy=0;p.grounded=true}camera=Math.max(0,Math.min(lengths[level]-W,p.x-W*.32));
for(const s of spikes)if(p.x+16>s.x&&p.x-16<s.x+s.w&&p.y>ground-22)damage();
for(const e of enemies){if(e.hp<=0)continue;e.cd-=dt;e.hit=Math.max(0,e.hit-dt);let dx=p.x-e.x;if(Math.abs(dx)<390&&Math.abs(dx)>45)e.x+=Math.sign(dx)*(65+level*16)*dt;if(Math.abs(dx)<52&&p.y>ground-65&&e.cd<=0){damage();e.cd=1.1}if(p.attack>0&&!p.swing.has(e)&&Math.abs(dx)<105&&-dx*p.facing>-18&&p.y>ground-115){p.swing.add(e);e.hp--;e.hit=.18;e.x+=p.facing*22;burst(e.x,ground-42,'#e2ecb3');if(e.hp<=0){kills++;updateHUD()}}}
for(let i=0;i<archers.length;i++){if(Math.floor((time-dt+i*.4)/2.3)!==Math.floor((time+i*.4)/2.3)&&Math.abs(archers[i]-p.x)<850)arrows.push({x:archers[i],y:ground-44,vx:-350-level*35})}
arrows=arrows.filter(a=>{a.x+=a.vx*dt;if(p.attack>0&&Math.abs(a.x-p.x)<95&&(a.x-p.x)*p.facing>0&&Math.abs(a.y-(p.y-35))<60){burst(a.x,a.y,'#e9d994',6);return false}let ph=p.duck?28:64;if(Math.abs(a.x-p.x)<23&&a.y>p.y-ph&&a.y<p.y){damage();return false}return a.x>camera-80});
particles=particles.filter(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;q.life-=dt;return q.life>0});
if(p.x>lengths[level]-115){if(enemies.every(e=>e.hp<=0)){if(level<2){mode='clear';panel('试炼通过。',`${names[level]}已通关。生命将在下一关恢复。`,'进入下一关')}else{mode='win';panel('风停，传奇未完。',`你已通过全部三关，击败 ${kills} 名守卫。`,'再玩一次')}}}updateHUD()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function person(x,y,enemy=false,duck=false,face=1,att=0,hit=0){ctx.save();ctx.translate(x,y);ctx.scale(face,1);let h=duck?30:60;ctx.strokeStyle=enemy?'#bc655e':'#d6e9ca';ctx.lineWidth=7;ctx.lineCap='round';let run=Math.sin(time*13)*(enemy?5:Math.abs(player?.vx||0)>0?11:1);ctx.beginPath();ctx.moveTo(-9,-2);ctx.lineTo(-5-run,-h*.38);ctx.lineTo(0,-h*.65);ctx.lineTo(7,-h*.37);ctx.lineTo(12+run,-2);ctx.stroke();rect(-11,-h*.78,23,h*.43,hit?'#fff5c8':enemy?'#783b43':'#528d7c');ctx.fillStyle=enemy?'#d3a081':'#efce9f';ctx.beginPath();ctx.arc(0,-h-1,10,0,7);ctx.fill();rect(-11,-h-10,23,6,enemy?'#674650':'#b4d999');ctx.fillStyle=enemy?'#9f4c4e':'#e7bd70';ctx.beginPath();ctx.moveTo(-8,-h*.75);ctx.lineTo(-30-(Math.sin(time*9)*4),-h*.63);ctx.lineTo(-9,-h*.46);ctx.fill();ctx.translate(10,-h*.56);ctx.rotate(att?-.6+Math.sin(att/.26*Math.PI)*1.4:-.6);rect(0,-3,enemy?29:43,5,'#dce9e2');rect(0,-8,4,15,'#d5ad65');if(att&&!enemy){ctx.strokeStyle='#f0f6b9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-8,-3,78,-1.3,1.1);ctx.stroke()}ctx.restore()}
function draw(){ctx.setTransform(1,0,0,1,0,0);rect(0,0,canvas.width,canvas.height,'#07151f');ctx.translate((canvas.width-W*scale)/2,(canvas.height-H*scale)/2);ctx.scale(scale,scale);ctx.save();if(shake>0)ctx.translate(Math.sin(time*80)*5,0);let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,['#0b2532','#302333','#111e38'][level]);grad.addColorStop(1,'#306059');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='#dae6ba';ctx.beginPath();ctx.arc(1030-camera*.04,135,48,0,7);ctx.fill();for(let layer=0;layer<3;layer++){let c=['#25474c','#1a3d40','#102c32'][layer];for(let i=-2;i<20;i++){let x=i*165-camera*(.1+layer*.17)%165;let top=180+Math.sin(i*9+layer)*70-layer*25;rect(x,top,18+layer*10,ground-top,c);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-65,top+80);ctx.lineTo(x+12,top-100);ctx.lineTo(x+95,top+100);ctx.fill()}}rect(0,ground,W,160,'#0b242b');rect(0,ground,W,7,'#789c6c');for(let i=0;i<40;i++)rect(i*70-camera%70,ground+24+(i%3)*24,25,2,'#20404a');ctx.save();ctx.translate(-camera,0);
if(spikes)for(const s of spikes){ctx.fillStyle='#cfbca3';for(let x=s.x;x<s.x+s.w;x+=16){ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+8,ground-23);ctx.lineTo(x+16,ground);ctx.fill()}}
for(const x of archers||[]){rect(x-8,ground-135,16,135,'#32484b');rect(x-16,ground-60,32,30,'#997755');rect(x-20,ground-49,30,7,'#e9bf7b')}
let end=lengths[level]-85;rect(end-32,ground-145,64,145,'#608e8233');ctx.strokeStyle='#e0e9ab';ctx.lineWidth=4;ctx.strokeRect(end-32,ground-145,64,145);ctx.fillStyle='#e4ebbb';ctx.font='17px system-ui';ctx.textAlign='center';ctx.fillText(enemies?.some(e=>e.hp>0)?'击败全部守卫':'终点',end,ground-164);
for(const e of enemies||[])if(e.hp>0){person(e.x,e.y,true,false,player.x<e.x?-1:1,0,e.hit);for(let i=0;i<e.hp;i++)rect(e.x-14+i*10,e.y-90,7,4,'#ec9b84')}
if(player&&!(player.inv>0&&Math.floor(time*14)%2))person(player.x,player.y,false,player.duck,player.facing,player.attack);for(const a of arrows||[]){rect(a.x-14,a.y,28,3,'#e6c595');ctx.fillStyle='#e7e4cc';ctx.beginPath();ctx.moveTo(a.x-19,a.y+1);ctx.lineTo(a.x-9,a.y-4);ctx.lineTo(a.x-9,a.y+6);ctx.fill()}for(const q of particles||[]){ctx.globalAlpha=q.life/.6;rect(q.x,q.y,4,4,q.color)}ctx.globalAlpha=1;ctx.restore();if(player){rect(40,650,1200,3,'#47605d');rect(40,650,1200*player.x/lengths[level],3,'#d3e7a6')}ctx.restore()}
function frame(t){let dt=Math.min((t-last)/1000,.033);last=t;step(dt);draw();requestAnimationFrame(frame)}updateHUD();requestAnimationFrame(frame);
</script>
</html>
