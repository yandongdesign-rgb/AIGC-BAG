<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木声 WOODSOUND · 双卡收录机</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#39362e,#191b19 75%);color:#e6d9be;font:14px 'Segoe UI','Microsoft Yahei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffc678;outline-offset:4px}.machine{width:800px;height:600px;padding:23px 25px;position:relative;border:8px solid #422b1d;border-radius:18px;background:repeating-linear-gradient(2deg,transparent 0 3px,#1c100a30 4px,#a1743c18 6px),linear-gradient(100deg,#6d482d,#90613b 40%,#573a27);box-shadow:0 30px 75px #000a,inset 0 0 0 2px #ac7c4a,inset 0 0 22px #1b0d09}.screw{position:absolute;width:10px;height:10px;background:linear-gradient(135deg,#d2c7ad,#5c564c);border-radius:50%;box-shadow:1px 1px 3px #000}.screw:after{content:'';position:absolute;left:2px;top:4px;width:6px;height:1px;background:#302d27;transform:rotate(-35deg)}.screw:nth-child(1){top:8px;left:8px}.screw:nth-child(2){top:8px;right:8px}.screw:nth-child(3){bottom:8px;left:8px}.screw:nth-child(4){bottom:8px;right:8px}header{display:flex;align-items:center;justify-content:space-between;height:43px}h1{font-size:23px;letter-spacing:4px;margin:0;color:#f2e4c6;text-shadow:0 2px #382010}h1 small{font-size:11px;letter-spacing:2px;margin-left:10px}header span{font:11px monospace;letter-spacing:2px;color:#d4b98e}.panel{background:linear-gradient(#292c28,#20231f);border-radius:8px;border:2px solid #141711;box-shadow:0 2px 0 #c8975a60,inset 0 1px #777969;padding:15px}.upper{display:grid;grid-template-columns:138px 1fr 138px;gap:16px;height:193px;margin:12px 0}.speaker{border:5px solid #292a24;border-radius:7px;background:radial-gradient(circle,#090b09 1px,transparent 1.6px) 0 0/4px 4px,radial-gradient(circle at center,#4e5146,#1d201a 66%);box-shadow:inset 0 0 16px #000,0 1px #d5bb8340;position:relative}.speaker:after{content:'FULL RANGE • 8Ω';position:absolute;bottom:9px;width:100%;text-align:center;font:8px monospace;letter-spacing:1px;color:#a2a18b}.display{padding:11px 13px;background:#c1c29b;color:#303b2c;box-shadow:inset 0 3px 12px #18241290;border:5px solid #111710;border-radius:5px;height:111px;position:relative}.display .line{display:flex;justify-content:space-between;font:10px monospace;letter-spacing:1px}.station{font-weight:700;font-size:21px;margin:9px 0 5px}.freq{font:12px monospace}.scale{display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid #566045;font:9px monospace}.tuning{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.tuning label{font-size:10px;letter-spacing:1px}.knob{appearance:none;width:43px;height:43px;border-radius:50%;background:repeating-conic-gradient(#282b26 0 5deg,#10130f 6deg 10deg);border:3px solid #0b0d0a;box-shadow:1px 3px 4px #000;position:relative;touch-action:none}.knob:after{content:'';position:absolute;top:4px;left:18px;width:2px;height:12px;background:#c8bd9b;transform-origin:1px 15px;transform:rotate(var(--angle,0deg))}.radio-volume{width:75px;accent-color:#c0ae87}.decks{display:grid;grid-template-columns:1fr 1fr;gap:15px}.deck{height:116px;background:linear-gradient(#34362e,#20231e);border:2px solid #12160f;border-radius:7px;padding:9px 13px;box-shadow:inset 0 1px #77776a}.deck-label{display:flex;justify-content:space-between;color:#c4c1a9;font-size:10px;letter-spacing:1px}.window{height:67px;margin-top:9px;background:linear-gradient(125deg,#ffffff12,#11170f88);border:3px solid #10150f;border-radius:5px;display:flex;align-items:center;justify-content:space-around;position:relative}.reel{width:45px;height:45px;border-radius:50%;background:repeating-conic-gradient(#b7b7a1 0 25deg,#23291f 26deg 60deg);border:7px solid #151b12;box-shadow:0 0 0 1px #737760}.reel:after{content:'';display:block;width:11px;height:11px;border-radius:50%;background:#151b12;margin:10px}.running .reel{animation:spin 3s linear infinite}.winding .reel{animation:spin .35s linear infinite}.rewinding .reel{animation-direction:reverse}.tape-label{font:10px monospace;color:#c9c6ae;text-align:center;line-height:1.8}@keyframes spin{to{transform:rotate(360deg)}}.transport{margin-top:13px}.progress-row{display:flex;align-items:center;gap:10px;font:11px monospace;color:#c8c6b5}.progress-row input{flex:1;accent-color:#c8b283;height:12px}.controls{display:flex;gap:6px;margin-top:11px}.key{height:45px;flex:1;border:1px solid #a79e87;border-bottom:5px solid #8e856e;border-radius:4px;background:linear-gradient(#f0e8d5,#c9c0a9);color:#383d32;box-shadow:0 3px 3px #0007;font-size:16px}.key small{display:block;font-size:9px;margin-top:2px;letter-spacing:1px}.key:active,.key.pressed{transform:translateY(3px);border-bottom-width:2px;box-shadow:inset 0 2px 5px #0005}.record{color:#ac3528}.record.active{animation:blink 1s infinite}@keyframes blink{50%{color:#ff4635;box-shadow:0 0 12px #f33a}}.bottom{display:flex;align-items:center;gap:12px;margin-top:11px}.bottom select{max-width:195px;background:#181e16;color:#c5c8a9;border:1px solid #62674e;border-radius:3px;padding:4px;font-size:12px}.bottom label{font-size:11px;white-space:nowrap}.bottom input{accent-color:#c3aa77}.levels{height:18px;display:flex;gap:3px;align-items:end;flex:1}.levels i{display:block;flex:1;background:#c6b775;height:3px;transition:height .08s}.levels i:nth-last-child(-n+3){background:#bb634b}footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:10px;color:#e2c89f}.status{max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}footer button{border:0;color:#f0dbb7;background:none;font-size:11px;text-decoration:underline}dialog{width:420px;border:2px solid #88714e;background:#252a22;color:#e9dfc8;border-radius:8px;padding:24px;line-height:1.8}dialog::backdrop{background:#0009}dialog button{padding:7px 20px}body:before{content:'ANALOG SOUL. DIGITAL HEART.';position:fixed;bottom:20px;font:10px monospace;letter-spacing:4px;color:#8d8e79}@media(max-width:820px){body{display:block;overflow:auto;padding:15px}.machine{margin:auto}}@media(prefers-reduced-motion:reduce){.reel,.record.active{animation:none!important}}
</style></head><body><main class="machine"><i class="screw"></i><i class="screw"></i><i class="screw"></i><i class="screw"></i><header><h1>木声<small>WOODSOUND</small></h1><span>STEREO CASSETTE RECORDER · WS-1984</span></header><section class="panel"><div class="upper"><div class="speaker"></div><div><div class="display" aria-live="polite"><div class="line"><span id="mode">TAPE / 待机</span><span>STEREO ◉</span></div><div class="station" id="station">中国之声</div><div class="freq" id="frequency">CH 01 · 网络广播</div><div class="scale"><span>FM</span><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108 MHz</span></div></div><div class="tuning"><label>电台调谐<br>TUNING</label><button class="knob" id="dial" aria-label="频道拨盘：拖动、滚轮或方向键切台" title="拖动 / 滚轮 / 方向键切台"></button><label>广播音量<br><input class="radio-volume" id="radioVolume" type="range" min="0" max="1" step=".01" value=".6" aria-label="广播音量"></label><button id="radio" title="播放或停止电台" style="background:none;border:1px solid #878b72;color:#d4d4bb;border-radius:3px;padding:7px">FM 开关</button></div></div><div class="speaker"></div></div><div class="decks"><div class="deck" id="deckA"><div class="deck-label"><span>A · RECORD / PLAY</span><span>录音卡座</span></div><div class="window"><div class="reel"></div><div class="tape-label">NORMAL POSITION<br>—— Ⅰ ——</div><div class="reel"></div></div></div><div class="deck" id="deckB"><div class="deck-label"><span>B · OVERDUB / MIX</span><span>混音卡座</span></div><div class="window"><div class="reel"></div><div class="tape-label">HIGH FIDELITY<br> C — 60 </div><div class="reel"></div></div></div></div><div class="transport"><div class="progress-row"><span id="elapsed">00:00</span><input type="range" id="progress" min="0" max="1" step=".01" value="0" aria-label="磁带进度"><span id="duration">00:00</span></div><div class="controls"><button class="key record" id="record">●<small>录音 REC</small></button><button class="key" id="rewind">◀◀<small>长按倒带</small></button><button class="key" id="play">▶<small>播放 PLAY</small></button><button class="key" id="forward">▶▶<small>长按快进</small></button><button class="key" id="stop">■<small>停止 STOP</small></button><button class="key" id="speed">1×<small>播放速度</small></button></div></div><div class="bottom"><select id="clips" aria-label="录音片段"><option value="">尚无录音 · 点击红键开始</option></select><label><input id="loop" type="checkbox"> 循环</label><label><input id="layer" type="checkbox"> 多段叠加</label><div class="levels" id="levels" aria-label="录音电平"></div></div></section><footer><span class="status" id="status" role="status">准备就绪 · 录下此刻，让声音慢下来。</span><span><button id="download">导出 WAV</button><button id="help">使用说明</button></span></footer></main><dialog id="dialog"><div id="message"></div><form method="dialog"><button>知道了</button></form></dialog><script src="app.js"></script></body></html>
