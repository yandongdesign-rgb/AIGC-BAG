<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>剑影疾行 · 横版闯关小游戏</title>
<style>
  :root{
    --ink:#1f2937;
    --muted:#6b7280;
    --panel:#ffffff;
    --accent:#e05a3c;
    --accent2:#f2a03d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#f4f5f7;
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  #stage{
    position:relative;
    line-height:0;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 18px 50px rgba(31,41,55,.18),0 2px 8px rgba(31,41,55,.12);
    background:#cfe9ff;
  }
  canvas{display:block;image-rendering:auto;}

  /* ---------- 菜单遮罩 ---------- */
  .overlay{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(24,32,48,.55);
    backdrop-filter:blur(4px);
    line-height:1.5;
    transition:opacity .18s ease;
  }
  .overlay.hidden{opacity:0;pointer-events:none;}
  .panel{
    width:min(560px,88%);
    background:var(--panel);
    border-radius:18px;
    padding:30px 36px 32px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .eyebrow{font-size:12px;letter-spacing:.28em;color:var(--accent);font-weight:700;margin-bottom:6px;}
  .panel h1{
    margin:0 0 8px;
    font-size:42px;letter-spacing:.08em;
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .panel h2{margin:0 0 12px;font-size:30px;color:var(--ink);}
  .panel p{margin:6px 0 14px;color:var(--muted);font-size:15px;}
  .keys{
    display:grid;grid-template-columns:repeat(2,1fr);gap:9px 18px;
    text-align:left;margin:20px auto 22px;max-width:430px;
    font-size:14px;color:#374151;
  }
  .keys div{display:flex;align-items:center;gap:9px;}
  kbd{
    display:inline-block;min-width:34px;padding:3px 7px;
    border:1px solid #d1d5db;border-bottom-width:3px;border-radius:6px;
    background:#f9fafb;color:#111827;font:600 12px/1.4 ui-monospace,Consolas,monospace;
    text-align:center;white-space:nowrap;
  }
  .btn{
    border:none;cursor:pointer;
    padding:13px 34px;border-radius:999px;
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    color:#fff;font-size:16px;font-weight:700;letter-spacing:.08em;
    box-shadow:0 8px 20px rgba(224,90,60,.32);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 11px 24px rgba(224,90,60,.4);}
  .btn:active{transform:translateY(0);}
  .tip{font-size:12px;color:#9ca3af;margin-top:14px;}

  /* ---------- 触屏按钮 ---------- */
  #touch{position:absolute;inset:auto 0 0 0;height:150px;pointer-events:none;display:none;}
  #touch .tp{
    position:absolute;pointer-events:auto;
    width:58px;height:58px;border-radius:50%;
    background:rgba(255,255,255,.72);border:2px solid rgba(31,41,55,.18);
    color:#243044;font-size:19px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  #touch .tp.on{background:rgba(224,90,60,.85);color:#fff;}
  #tLeft{left:18px;bottom:22px;} #tRight{left:88px;bottom:22px;}
  #tJump{right:18px;bottom:76px;} #tCrouch{right:88px;bottom:22px;} #tAtk{right:18px;bottom:12px;}

  @media (pointer:coarse){ #touch{display:block;} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="touch">
    <div class="tp" id="tLeft">左</div>
    <div class="tp" id="tRight">右</div>
    <div class="tp" id="tJump">跳</div>
    <div class="tp" id="tCrouch">蹲</div>
    <div class="tp" id="tAtk">斩</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="eyebrow" id="ovEyebrow">SIDE-SCROLLING ADVENTURE</div>
      <h1 id="ovTitle">剑影疾行</h1>
      <p id="ovDesc">越过陷阱、躲过矮梁，用手中之剑打通三道关卡。</p>
      <div class="keys" id="ovKeys">
        <div><kbd>A D</kbd><span>左右移动</span></div>
        <div><kbd>W</kbd><span>跳跃（长按跳更高）</span></div>
        <div><kbd>S</kbd><span>下蹲，钻过矮梁</span></div>
        <div><kbd>J</kbd><span>挥剑攻击敌人</span></div>
        <div><kbd>P</kbd><span>暂停 / 继续</span></div>
        <div><kbd>M</kbd><span>开关音效</span></div>
      </div>
      <button class="btn" id="ovBtn">开始游戏</button>
      <div class="tip">方向键 / 空格 同样可用 · 按 Enter 开始</div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ===================== 基础设置 ===================== */
const W = 960, H = 540;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const overlay = document.getElementById('overlay');
const ovEyebrow = document.getElementById('ovEyebrow');
const ovTitle = document.getElementById('ovTitle');
const ovDesc = document.getElementById('ovDesc');
const ovKeys = document.getElementById('ovKeys');
const ovBtn = document.getElementById('ovBtn');

function fit(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  stage.style.width  = (W * s) + 'px';
  stage.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

const GRAV = 1950, SPEED = 300, JUMP_V = 740;
const SWING_TIME = 0.28, SWING_CD = 0.36;

/* ===================== 关卡数据 ===================== */
function ground(x,w,y){ return {x:x,y:y,w:w,h:130,kind:'ground'}; }
function beam(x,w,y){ return {x:x,y:y,w:w,h:42,kind:'beam'}; }
function ledge(x,y,w){ return {x:x,y:y,w:w,h:20,kind:'stone'}; }
function slime(x,y,a,b){ return {type:'slime',x:x,y:y,w:26,h:24,minX:a,maxX:b,speed:78}; }
function goblin(x,y,a,b){ return {type:'goblin',x:x,y:y,w:28,h:34,minX:a,maxX:b,speed:56}; }
function bat(x,y,range){ return {type:'bat',x:x,y:y,w:28,h:22,range:range}; }
function coin(x,y){ return {x:x,y:y}; }

const LEVELS = [
  {
    name:'晨光草原', tag:'第一关',
    palette:{sky1:'#7fc9ff',sky2:'#e9f7ff',sun:'#fff3b0',hill1:'#a8dfa0',hill2:'#79c98a',grass:'#59b95f',dirt:'#96653f',dirt2:'#7c5031',beam:'#b98455',ink:'#2c4a35'},
    spawn:{x:60,y:400}, worldW:2860, goal:{x:2620,y:440},
    platforms:[ground(-80,980,440),ground(1000,700,440),ground(1820,900,440),
               beam(1300,170,368),ledge(560,350,110),ledge(2130,354,120)],
    enemies:[slime(520,416,380,720),goblin(1090,406,1010,1260),slime(1560,416,1430,1680),
             bat(2050,300,110),goblin(2330,406,2070,2520)],
    coins:[coin(450,398),coin(575,314),coin(625,314),coin(1050,398),coin(1410,392),
           coin(1460,392),coin(1550,326),coin(1900,398),coin(2160,318),coin(2205,318),coin(2480,398)],
    checkpoints:[{x:1015,y:440},{x:1830,y:440}],
    hints:[{x:830,text:'空格 / W 跳跃'},{x:1220,text:'S / ↓ 下蹲通过'}]
  },
  {
    name:'黄昏峡谷', tag:'第二关',
    palette:{sky1:'#ffab6b',sky2:'#ffe7bd',sun:'#ffd98a',hill1:'#e8a879',hill2:'#bd7857',grass:'#a7bb52',dirt:'#8d5b3a',dirt2:'#71472d',beam:'#9d6a48',ink:'#4a3027'},
    spawn:{x:60,y:400}, worldW:3160, goal:{x:2850,y:380},
    platforms:[ground(-80,780,440),ground(830,520,400),ground(1480,620,440),ground(2230,700,380),
               beam(1080,150,328),beam(2500,140,308),ledge(720,374,90),ledge(1380,370,80),ledge(2120,330,90)],
    enemies:[slime(400,416,300,600),goblin(910,366,845,1055),bat(1230,290,95),slime(1620,416,1500,1820),
             goblin(1920,406,1820,2060),bat(2360,262,100),slime(2700,356,2600,2860)],
    coins:[coin(360,398),coin(745,338),coin(860,358),coin(950,290),coin(1120,358),coin(1290,358),
           coin(1520,398),coin(1700,398),coin(1890,398),coin(2140,294),coin(2260,338),coin(2620,338),coin(2790,338)],
    checkpoints:[{x:845,y:400},{x:1490,y:440},{x:2240,y:380}],
    hints:[{x:1040,text:'矮梁！下蹲通过'},{x:2460,text:'当心蝙蝠'}]
  },
  {
    name:'夜幕城堡', tag:'第三关',
    palette:{sky1:'#162444',sky2:'#40558a',sun:'#f4f1d0',hill1:'#2b3b66',hill2:'#1d2b50',grass:'#4f78a8',dirt:'#4a4260',dirt2:'#393350',beam:'#6b617f',ink:'#dce6ff',night:true},
    spawn:{x:60,y:400}, worldW:3360, goal:{x:3080,y:440},
    platforms:[ground(-80,620,440),ground(700,420,400),ground(1240,380,360),ground(1740,520,420),ground(2380,800,440),
               beam(820,130,328),beam(1900,150,348),beam(2560,120,368),
               ledge(610,360,80),ledge(1140,318,90),ledge(1660,328,80),ledge(2280,358,100)],
    enemies:[goblin(300,406,200,500),bat(560,300,80),slime(760,376,730,1000),goblin(1060,366,1010,1090),
             slime(1360,336,1270,1570),bat(1510,244,90),goblin(1830,386,1780,2120),bat(2140,290,100),
             goblin(2460,406,2410,2730),slime(2870,416,2780,3060),bat(2980,268,80)],
    coins:[coin(350,398),coin(620,324),coin(730,358),coin(880,360),coin(1160,282),coin(1290,318),
           coin(1500,318),coin(1680,292),coin(1800,378),coin(2010,378),coin(2140,254),coin(2300,322),
           coin(2440,398),coin(2700,398),coin(2870,398),coin(3040,398)],
    checkpoints:[{x:710,y:400},{x:1250,y:360},{x:1750,y:420},{x:2390,y:440}],
    hints:[{x:640,text:'跳过缺口'},{x:790,text:'低头！'}]
  }
];

/* ===================== 输入 ===================== */
const keys = Object.create(null);
const touch = {left:false,right:false,jump:false,crouch:false,atk:false};
let muted = false, audio = null;

function audioUnlock(){
  if(!audio){
    try{ audio = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audio = null; }
  }
  if(audio && audio.state === 'suspended') audio.resume();
}
function sfx(kind){
  if(!audio || muted) return;
  const cfg = {
    jump:[520,0.16,'square',0.045,240], slash:[820,0.10,'sawtooth',0.035,-460],
    hit:[180,0.16,'square',0.06,-90], hurt:[240,0.28,'sawtooth',0.07,-160],
    coin:[980,0.10,'triangle',0.05,320], dead:[520,0.10,'triangle',0.035,180],
    flag:[620,0.24,'triangle',0.05,520], win:[660,0.45,'triangle',0.055,660],
    check:[740,0.20,'triangle',0.045,300]
  }[kind];
  if(!cfg) return;
  const [f,d,type,vol,slide] = cfg;
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if(f + slide > 30) o.frequency.exponentialRampToValueAtTime(f + slide, t + d);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + d + 0.02);
}

const isJumpKey = c => c==='Space'||c==='KeyW'||c==='ArrowUp';
const isDownKey = c => c==='KeyS'||c==='ArrowDown';
const isAtkKey  = c => c==='KeyJ'||c==='KeyX'||c==='KeyK';

window.addEventListener('keydown', e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0) e.preventDefault();
  audioUnlock();
  if(e.repeat) return;
  keys[e.code] = true;
  if(e.code==='Enter'){ onConfirm(); return; }
  if(e.code==='KeyP'||e.code==='Escape'){ togglePause(); return; }
  if(e.code==='KeyM'){ muted=!muted; toast(muted?'音效已关闭':'音效已开启',1.1); return; }
  if(state==='playing' && player){
    if(isJumpKey(e.code)){ player.jumpBuf=0.14; player.jumpHeld=true; }
    if(isAtkKey(e.code)) player.atkBuf=0.14;
  }
});
window.addEventListener('keyup', e=>{
  keys[e.code] = false;
  if(isJumpKey(e.code) && player) player.jumpHeld=false;
});
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; if(state==='playing') setPaused(true); });

function bindTouch(id, prop, onDown){
  const el = document.getElementById(id);
  const down = e=>{ e.preventDefault(); audioUnlock(); touch[prop]=true; el.classList.add('on'); if(onDown) onDown(); };
  const up = e=>{ e.preventDefault(); touch[prop]=false; el.classList.remove('on'); };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('pointerleave',up);
}
bindTouch('tLeft','left');
bindTouch('tRight','right');
bindTouch('tJump','jump',()=>{ if(state==='playing'&&player){player.jumpBuf=0.14;player.jumpHeld=true;} });
bindTouch('tCrouch','crouch');
bindTouch('tAtk','atk',()=>{ if(state==='playing'&&player) player.atkBuf=0.14; });

/* ===================== 游戏状态 ===================== */
let state = 'start';              // start | playing | paused | clear | gameover | victory
let levelIndex = 0, def = null;
let player = null, platforms = [], enemies = [], coins = [], particles = [];
let camX = 0, shake = 0, worldW = W, time = 0, introTimer = 0;
let score = 0, coinCount = 0, levelStartScore = 0, levelStartCoins = 0, toastText = '', toastTimer = 0;
let last = performance.now();

function overlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function loadLevel(i){
  levelIndex = i;
  def = LEVELS[i];
  levelStartScore = score; levelStartCoins = coinCount;
  def.checkpoints.forEach(cp=>{ cp.reached=false; });
  worldW = def.worldW;
  platforms = def.platforms.map(p=>Object.assign({},p));
  enemies = def.enemies.map(e=>Object.assign({},e,{
    baseX:e.x, baseY:e.y, dir:1, t:Math.random()*5, hp:e.type==='goblin'?2:1,
    flash:0, dead:false, deadT:0, vx:0
  }));
  coins = def.coins.map(c=>({x:c.x,y:c.y,got:false,spin:Math.random()*6}));
  particles = [];
  player = {
    x:def.spawn.x, y:def.spawn.y, w:26, h:40, vx:0, vy:0, facing:1,
    grounded:false, crouch:false, hp:3, invuln:0, knock:0,
    jumpBuf:0, jumpHeld:false, jumpCut:false, atkBuf:0, atkTimer:0, atkCd:0,
    hitSet:new Set(), sinceGround:1, runPhase:0, checkpoint:null, landT:0
  };
  camX = 0; shake = 0; introTimer = 2.0;
  toastText=''; toastTimer=0;
}
function startGame(i){ score=0; coinCount=0; loadLevel(i); state='playing'; hideOverlay(); }
function restartLevel(){ score = levelStartScore; coinCount = levelStartCoins; loadLevel(levelIndex); state='playing'; hideOverlay(); }
function nextLevel(){
  if(levelIndex+1 >= LEVELS.length){ showVictory(); return; }
  loadLevel(levelIndex+1); state='playing'; hideOverlay();
}
function toast(txt,t){ toastText=txt; toastTimer=t||1.6; }

function showOverlay(title,desc,btn,eyebrow,showKeys){
  ovEyebrow.textContent = eyebrow||'SIDE-SCROLLING ADVENTURE';
  ovTitle.textContent = title;
  ovDesc.textContent = desc;
  ovBtn.textContent = btn;
  ovKeys.style.display = showKeys?'grid':'none';
  overlay.classList.remove('hidden');
}
function hideOverlay(){ overlay.classList.add('hidden'); }
function onConfirm(){
  if(state==='start') startGame(0);
  else if(state==='paused') setPaused(false);
  else if(state==='clear') nextLevel();
  else if(state==='gameover') restartLevel();
  else if(state==='victory') startGame(0);
}
function togglePause(){ if(state==='playing') setPaused(true); else if(state==='paused') setPaused(false); }
function setPaused(p){
  if(p){ state='paused'; showOverlay('已暂停','按 P / Esc 继续冒险。','继续游戏','PAUSED',false); }
  else { state='playing'; hideOverlay(); }
}
function showClear(){
  state='clear'; sfx('flag');
  showOverlay('过关！','第 '+(levelIndex+1)+' 关「'+def.name+'」完成 · 当前得分 '+score+' · 金币 '+coinCount,
              levelIndex+1>=LEVELS.length?'查看结局':'下一关','LEVEL CLEAR',false);
}
function showGameOver(){
  state='gameover';
  showOverlay('挑战失败','体力耗尽了。按 Enter 或点击按钮，重新挑战「'+def.name+'」。','重新挑战','GAME OVER',false);
}
function showVictory(){
  state='victory'; sfx('win');
  showOverlay('通关！','三关全部通过！最终得分 '+score+'，收集金币 '+coinCount+' 枚。','再玩一次','VICTORY',false);
}
ovBtn.addEventListener('click',()=>{ audioUnlock(); onConfirm(); });

/* ===================== 特效 ===================== */
function burst(x,y,color,n,power){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(0.4+Math.random()*0.8)*(power||180);
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,
      life:0.35+Math.random()*0.35,max:0.7,g:620,size:2+Math.random()*3,color:color});
  }
}
function dust(x,y,n){
  for(let i=0;i<n;i++){
    particles.push({x:x+(Math.random()-0.5)*16,y:y,vx:(Math.random()-0.5)*90,
      vy:-Math.random()*80,life:0.25+Math.random()*0.25,max:0.5,g:180,
      size:2+Math.random()*3,color:'rgba(255,255,255,.8)'});
  }
}

/* ===================== 更新 ===================== */
function update(dt){
  if(state!=='playing') return;
  time += dt;
  introTimer = Math.max(0,introTimer-dt);
  toastTimer = Math.max(0,toastTimer-dt);
  shake = Math.max(0,shake-dt*26);

  const p = player;
  p.invuln = Math.max(0,p.invuln-dt);
  p.atkCd  = Math.max(0,p.atkCd-dt);
  p.atkBuf = Math.max(0,p.atkBuf-dt);
  p.jumpBuf= Math.max(0,p.jumpBuf-dt);
  p.knock  = Math.max(0,p.knock-dt);
  p.landT  = Math.max(0,p.landT-dt);

  const left  = keys.KeyA||keys.ArrowLeft||touch.left;
  const right = keys.KeyD||keys.ArrowRight||touch.right;
  const down  = keys.KeyS || keys.ArrowDown || touch.crouch;
  const jumpHeld = keys.Space||keys.KeyW||keys.ArrowUp||touch.jump;
  const dir = (right?1:0)-(left?1:0);

  // 下蹲 / 起身（头顶有障碍时保持下蹲）
  if(down && p.grounded && !p.crouch){ p.y+=16; p.h=24; p.crouch=true; dust(p.x+p.w/2,p.y+p.h,4); }
  else if(!down && p.crouch){
    const test={x:p.x,y:p.y-16,w:p.w,h:40};
    if(!platforms.some(pl=>overlap(test,pl))){ p.y-=16; p.h=40; p.crouch=false; }
  }

  // 水平移动
  if(p.knock>0){ p.vx *= Math.pow(0.02,dt); }
  else { p.vx += (dir*SPEED - p.vx)*Math.min(1,dt*14); }
  if(dir!==0 && p.knock<=0) p.facing = dir;
  if(p.grounded && Math.abs(p.vx)>20) p.runPhase += dt*Math.abs(p.vx)*0.045;

  // 跳跃（含土狼时间与跳跃缓冲）
  p.sinceGround += dt;
  if(p.grounded) p.sinceGround = 0;
  if(p.jumpBuf>0 && p.sinceGround<0.1){
    p.vy = -JUMP_V; p.grounded=false; p.sinceGround=1; p.jumpBuf=0; p.jumpCut=false;
    sfx('jump'); dust(p.x+p.w/2,p.y+p.h,6);
  }
  if(!jumpHeld && p.vy<0 && !p.jumpCut){ p.vy*=0.45; p.jumpCut=true; }
  p.vy += GRAV*dt;

  // 位移与碰撞
  p.x += p.vx*dt;
  for(const pl of platforms){
    if(overlap(p,pl)){
      if(p.vx>0) p.x = pl.x-p.w;
      else if(p.vx<0) p.x = pl.x+pl.w;
      p.vx = 0;
    }
  }
  p.y += p.vy*dt;
  const wasVy = p.vy;
  p.grounded = false;
  for(const pl of platforms){
    if(overlap(p,pl)){
      if(p.vy>0){ p.y = pl.y-p.h; p.vy=0; p.grounded=true; }
      else if(p.vy<0){ p.y = pl.y+pl.h; p.vy=0; }
    }
  }
  if(p.grounded && wasVy>340){ p.landT=0.14; dust(p.x+p.w/2,p.y+p.h,7); }

  // 掉进深坑
  if(p.y > H+100){ hurtPlayer(true); if(state!=='playing') return; }

  // 挥剑
  if(p.atkBuf>0 && p.atkCd<=0 && p.atkTimer<=0){
    p.atkTimer=SWING_TIME; p.atkCd=SWING_CD; p.atkBuf=0; p.hitSet.clear(); sfx('slash');
  }
  if(p.atkTimer>0) p.atkTimer = Math.max(0,p.atkTimer-dt);
  const swing = 1 - p.atkTimer/SWING_TIME;
  const active = p.atkTimer>0 && swing>0.18 && swing<0.68;
  const reach=54;
  const blade = p.crouch
    ? {x:p.facing>0?p.x+p.w-8:p.x-reach+8, y:p.y+2, w:reach, h:26}
    : {x:p.facing>0?p.x+p.w-8:p.x-reach+8, y:p.y-6, w:reach, h:50};
  const body = {x:p.x,y:p.y,w:p.w,h:p.h};

  // 敌人
  for(const e of enemies){
    if(e.dead){ e.deadT+=dt; continue; }
    e.t += dt;
    e.flash = Math.max(0,e.flash-dt);
    if(e.type==='bat'){
      e.x = e.baseX + Math.sin(e.t*1.15)*e.range;
      e.y = e.baseY + Math.sin(e.t*2.6)*17;
    } else {
      e.x += e.dir*e.speed*dt;
      if(e.x<e.minX){e.x=e.minX;e.dir=1;}
      if(e.x>e.maxX){e.x=e.maxX;e.dir=-1;}
    }
    if(e.vx!==0){ e.x+=e.vx*dt; e.vx*=Math.pow(0.02,dt); if(Math.abs(e.vx)<4) e.vx=0; }
    const eb = {x:e.x,y:e.y,w:e.w,h:e.h};
    if(active && !p.hitSet.has(e) && overlap(blade,eb)){
      p.hitSet.add(e);
      e.hp--; e.flash=0.18; e.vx = p.facing*190;
      burst(e.x+e.w/2,e.y+e.h/2,'#fff3b0',9,190);
      shake=Math.max(shake,4); sfx(e.hp>0?'hit':'dead');
      if(e.hp<=0){ e.dead=true; score += e.type==='goblin'?100:(e.type==='bat'?80:50); }
      continue;
    }
    if(overlap(body,eb) && p.invuln<=0) hurtPlayer(false, e);
  }

  // 金币
  for(const c of coins){
    if(c.got) continue;
    c.spin += dt*4;
    if(overlap(body,{x:c.x,y:c.y,w:18,h:18})){
      c.got=true; coinCount++; score+=10; sfx('coin');
      burst(c.x+9,c.y+9,'#ffd75e',7,130);
    }
  }

  // 检查点
  for(const cp of def.checkpoints){
    if(cp.reached) continue;
    if(p.x+p.w >= cp.x){ cp.reached=true; p.checkpoint={x:cp.x,y:cp.y}; toast('检查点已激活',1.5); sfx('check'); }
  }

  // 终点
  if(overlap(body,{x:def.goal.x,y:def.goal.y-100,w:16,h:100})){
    score += 200; showClear(); return;
  }

  // 相机 / 粒子
  const target = clamp(p.x-W*0.34,0,Math.max(0,worldW-W));
  camX += (target-camX)*Math.min(1,dt*6);
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];
    q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt;
    if(q.life<=0) particles.splice(i,1);
  }
}

function hurtPlayer(pit, enemy){
  const p=player;
  if(!pit && p.invuln>0) return;
  if(p.hp<=0) return;
  p.hp--;
  shake=9;
  burst(p.x+p.w/2,p.y+p.h/2,'#ff8a6b',12,230);
  sfx('hurt');
  if(p.hp<=0){ showGameOver(); return; }
  if(pit){
    const cp=p.checkpoint||{x:def.spawn.x,y:def.spawn.y+40};
    p.x=cp.x; p.y=cp.y-p.h; p.vx=0; p.vy=0;
    p.invuln=1.6; camX=clamp(p.x-W*0.34,0,Math.max(0,worldW-W));
    toast('小心脚下！',1.2);
  } else {
    p.invuln=1.15; p.knock=0.16;
    p.vx=(enemy && enemy.x < p.x ? 1 : -1)*230; p.vy=-320;
  }
}

/* ===================== 绘制 ===================== */
function heart(x,y,filled,color){
  ctx.save(); ctx.translate(x,y); ctx.beginPath();
  ctx.moveTo(0,4);
  ctx.bezierCurveTo(-9,-3,-7,-11,0,-6);
  ctx.bezierCurveTo(7,-11,9,-3,0,4);
  ctx.closePath();
  ctx.fillStyle = filled?color:'rgba(255,255,255,.22)';
  ctx.fill();
  ctx.strokeStyle = filled?'rgba(0,0,0,.18)':'rgba(255,255,255,.5)';
  ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
}

function drawBackground(pal){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,pal.sky1); g.addColorStop(1,pal.sky2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  if(pal.night){
    ctx.fillStyle='rgba(255,255,255,.8)';
    for(let i=0;i<44;i++){
      const x=(i*137.5)%W, y=(i*71.3)%230+10;
      const tw=0.35+0.35*Math.sin(time*2+i);
      ctx.globalAlpha=tw; ctx.fillRect(x,y,2,2);
    }
    ctx.globalAlpha=1;
  }

  // 太阳 / 月亮
  ctx.fillStyle=pal.sun; ctx.globalAlpha=pal.night?0.95:0.75;
  ctx.beginPath(); ctx.arc(795,92,pal.night?30:38,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  if(pal.night){ ctx.fillStyle=pal.sky1; ctx.beginPath(); ctx.arc(807,82,27,0,Math.PI*2); ctx.fill(); }

  // 云（视差）
  ctx.fillStyle=pal.night?'rgba(200,215,255,.12)':'rgba(255,255,255,.68)';
  for(let i=0;i<6;i++){
    const cx=((i*230 - camX*0.18 + time*7)%(W+260)+W+260)%(W+260)-130;
    const cy=62+(i%3)*42;
    ctx.beginPath();
    ctx.arc(cx,cy,22,0,Math.PI*2); ctx.arc(cx+26,cy-9,28,0,Math.PI*2);
    ctx.arc(cx+56,cy,21,0,Math.PI*2); ctx.fill();
  }

  // 远山
  ctx.fillStyle=pal.hill2;
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=20){
    const wx=x+camX*0.35;
    ctx.lineTo(x, 350+Math.sin(wx*0.004)*40+Math.sin(wx*0.011)*18);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle=pal.hill1;
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=20){
    const wx=x+camX*0.55+500;
    ctx.lineTo(x, 408+Math.sin(wx*0.005)*26+Math.sin(wx*0.013)*12);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();

  // 城堡剪影
  if(pal.night){
    ctx.fillStyle='rgba(12,18,38,.55)';
    for(let i=0;i<6;i++){
      const bx=((i*420-camX*0.62)%(W+500)+W+500)%(W+500)-250;
      ctx.fillRect(bx,330,58,130);
      ctx.fillRect(bx-8,318,74,14);
      ctx.fillRect(bx+8,296,16,24);
      ctx.fillRect(bx+36,304,12,16);
    }
  }
}

function drawPlatforms(pal){
  for(const pl of platforms){
    const x=pl.x-camX;
    if(x+pl.w<-40 || x>W+40) continue;
    if(pl.kind==='beam'){
      ctx.fillStyle=pal.beam; ctx.fillRect(x,pl.y,pl.w,pl.h);
      ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(x,pl.y,pl.w,5);
      ctx.fillStyle='rgba(0,0,0,.16)';
      for(let i=18;i<pl.w;i+=34) ctx.fillRect(x+i,pl.y+7,3,pl.h-7);
      ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(x,pl.y+pl.h-4,pl.w,4);
      continue;
    }
    if(pl.kind==='stone'){
      ctx.fillStyle=pal.dirt2; ctx.fillRect(x,pl.y,pl.w,pl.h);
      ctx.fillStyle=pal.grass; ctx.fillRect(x,pl.y,pl.w,6);
      ctx.fillStyle='rgba(255,255,255,.14)'; ctx.fillRect(x+3,pl.y+7,pl.w-6,2);
      continue;
    }
    ctx.fillStyle=pal.dirt; ctx.fillRect(x,pl.y,pl.w,pl.h);
    ctx.fillStyle=pal.dirt2;
    for(let i=12;i<pl.w;i+=46){
      ctx.fillRect(x+i,pl.y+26,5,5); ctx.fillRect(x+i+19,pl.y+58,4,4);
    }
    ctx.fillStyle=pal.grass; ctx.fillRect(x,pl.y,pl.w,14);
    ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fillRect(x,pl.y,pl.w,4);
    ctx.fillStyle=pal.grass;
    for(let i=6;i<pl.w;i+=13){
      const h=3+((i*7)%5);
      ctx.fillRect(x+i,pl.y-h,3,h);
    }
  }
}

function drawCoins(){
  for(const c of coins){
    if(c.got) continue;
    const x=c.x-camX, w=Math.abs(Math.cos(c.spin))*10+3;
    ctx.save(); ctx.translate(x+9,c.y+9);
    ctx.fillStyle='#f5b521'; ctx.beginPath(); ctx.ellipse(0,0,w,9,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ffe9a3'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff0b8';
    ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(3,0); ctx.lineTo(0,4); ctx.lineTo(-3,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawFlags(){
  for(const cp of def.checkpoints){
    if(cp.reached===undefined) cp.reached=false;
    const x=cp.x-camX;
    if(x<-40||x>W+40) continue;
    ctx.fillStyle='#e5e7eb'; ctx.fillRect(x-2,cp.y-76,4,76);
    ctx.fillStyle=cp.reached?'#38bdf8':'#9ca3af';
    ctx.beginPath(); ctx.moveTo(x+2,cp.y-74); ctx.lineTo(x+44,cp.y-62);
    ctx.lineTo(x+2,cp.y-50); ctx.closePath(); ctx.fill();
    if(cp.reached){ ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.fillText('已',x+11,cp.y-63); }
  }
  const gx=def.goal.x-camX;
  if(gx>-60&&gx<W+60){
    ctx.fillStyle='#f8fafc'; ctx.fillRect(gx-3,def.goal.y-112,6,112);
    const wave=Math.sin(time*5)*4;
    ctx.fillStyle='#e05a3c';
    ctx.beginPath(); ctx.moveTo(gx+3,def.goal.y-110);
    ctx.quadraticCurveTo(gx+36+wave,def.goal.y-98,gx+66,def.goal.y-88);
    ctx.quadraticCurveTo(gx+34-wave,def.goal.y-76,gx+3,def.goal.y-66);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText('终点',gx+30,def.goal.y-85);
    ctx.textAlign='left';
  }
}

function drawEnemies(){
  for(const e of enemies){
    if(e.dead) continue;
    const x=e.x-camX, y=e.y;
    if(x<-60||x>W+60) continue;
    ctx.save(); ctx.translate(x+e.w/2,y+e.h);
    if(e.flash>0) ctx.globalAlpha=0.45;
    if(e.type==='slime'){
      const sq=1+Math.sin(e.t*7)*0.07;
      ctx.scale(1/sq,sq);
      ctx.fillStyle='#43a86b';
      ctx.beginPath(); ctx.moveTo(-13,0); ctx.quadraticCurveTo(-15,-24,0,-24);
      ctx.quadraticCurveTo(15,-24,13,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-5,-17,4,2,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0f2e1c';
      ctx.fillRect(-7,-13,4,5); ctx.fillRect(3,-13,4,5);
      ctx.fillStyle='#fff'; ctx.fillRect(-6,-13,2,2); ctx.fillRect(4,-13,2,2);
    } else if(e.type==='goblin'){
      ctx.fillStyle='#4b3b30'; ctx.fillRect(-8,-13,15,13);
      ctx.fillStyle='#6fb05f';
      ctx.fillRect(-9,-31,19,18);
      ctx.fillRect(-11,-33,5,7); ctx.fillRect(6,-33,5,7);
      ctx.fillStyle='#ffe27a'; ctx.fillRect(-7,-27,5,4); ctx.fillRect(3,-27,5,4);
      ctx.fillStyle='#142a16'; ctx.fillRect(-6,-27,2,3); ctx.fillRect(4,-27,2,3);
      ctx.fillStyle='#6b4a32';
      ctx.save(); ctx.translate(11,-20); ctx.rotate(Math.sin(e.t*8)*0.35+0.5);
      ctx.fillRect(-2,-16,4,19); ctx.fillRect(-6,-20,12,7); ctx.restore();
      ctx.fillStyle='#3d2f26'; ctx.fillRect(-8,0,6,3); ctx.fillRect(3,0,6,3);
      if(e.hp>1){ ctx.fillStyle='#ff6b5e'; ctx.fillRect(-9,-39,18,3); }
    } else {
      const flap=Math.sin(e.t*14)*8;
      ctx.fillStyle='#7752b5';
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(-17,-14-flap); ctx.lineTo(-13,-2);
      ctx.lineTo(-6,-8); ctx.lineTo(0,-3); ctx.lineTo(6,-8);
      ctx.lineTo(13,-2); ctx.lineTo(17,-14-flap); ctx.lineTo(0,-12); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#4b327d'; ctx.beginPath(); ctx.ellipse(0,-12,7,9,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffd85e'; ctx.fillRect(-5,-15,3,3); ctx.fillRect(2,-15,3,3);
      ctx.fillStyle='#fff'; ctx.fillRect(-4,-15,1,1); ctx.fillRect(3,-15,1,1);
    }
    ctx.restore();
  }
}

function drawPlayer(){
  const p=player;
  const pal=def.palette;
  ctx.save();
  if(p.invuln>0 && Math.floor(time*18)%2===0) ctx.globalAlpha=0.42;
  ctx.translate(p.x-camX+p.w/2, p.y+p.h);
  ctx.scale(p.facing, p.h/40);

  // 腿
  const running = p.grounded && Math.abs(p.vx)>20;
  const swingLeg = running ? Math.sin(p.runPhase)*7 : (p.grounded?0:4);
  ctx.fillStyle='#2f3a56';
  ctx.save(); ctx.translate(-5,-8); ctx.rotate(swingLeg*0.08); ctx.fillRect(-3,0,6,9); ctx.restore();
  ctx.save(); ctx.translate(5,-8); ctx.rotate(-swingLeg*0.08); ctx.fillRect(-3,0,6,9); ctx.restore();
  ctx.fillStyle='#1f2937'; ctx.fillRect(-9,-2,8,3); ctx.fillRect(2,-2,8,3);

  // 披风
  ctx.fillStyle='#c93d3d';
  const flutter=Math.sin(time*9)*2+Math.abs(p.vx)*0.012;
  ctx.beginPath(); ctx.moveTo(-6,-30); ctx.lineTo(-16-flutter,-22);
  ctx.lineTo(-13-flutter,-9); ctx.lineTo(-4,-13); ctx.closePath(); ctx.fill();

  // 身体
  ctx.fillStyle='#3f6fb5'; ctx.beginPath();
  ctx.moveTo(-9,-29); ctx.lineTo(9,-29); ctx.lineTo(10,-11); ctx.lineTo(-10,-11); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e9c46a'; ctx.fillRect(-10,-15,20,3);
  ctx.fillStyle='#f2f5fb'; ctx.fillRect(-2,-28,4,15);

  // 头与头盔
  ctx.fillStyle='#f2c9a0'; ctx.beginPath(); ctx.arc(1,-34,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#cbd5e1';
  ctx.beginPath(); ctx.arc(0,-36,9,Math.PI,0); ctx.lineTo(9,-33); ctx.lineTo(-9,-33); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#94a3b8'; ctx.fillRect(-10,-34,20,3);
  ctx.fillStyle='#dc2626';
  ctx.beginPath(); ctx.moveTo(-3,-45); ctx.lineTo(0,-53); ctx.lineTo(4,-45); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#243044'; ctx.fillRect(4,-34,3,3);

  // 剑（挥砍动画）
  const prog = p.atkTimer>0 ? 1-p.atkTimer/SWING_TIME : -1;
  ctx.save();
  ctx.translate(8,-21);
  let ang = -0.35;
  if(prog>=0){
    if(prog<0.22) ang = -1.35 + (prog/0.22)*0.35;
    else if(prog<0.68) ang = -1.0 + ((prog-0.22)/0.46)*2.05;
    else ang = 1.05 - ((prog-0.68)/0.32)*1.4;
  }
  ctx.rotate(ang);
  ctx.fillStyle='#6b4a32'; ctx.fillRect(-7,-2,10,4);
  ctx.fillStyle='#e9c46a'; ctx.fillRect(3,-6,4,12);
  const bladeGrad=ctx.createLinearGradient(7,0,42,0);
  bladeGrad.addColorStop(0,'#e2e8f0'); bladeGrad.addColorStop(0.6,'#ffffff'); bladeGrad.addColorStop(1,'#94a3b8');
  ctx.fillStyle=bladeGrad;
  ctx.beginPath(); ctx.moveTo(7,-3); ctx.lineTo(40,-2); ctx.lineTo(46,0);
  ctx.lineTo(40,2); ctx.lineTo(7,3); ctx.closePath(); ctx.fill();
  ctx.restore();

  // 剑气
  if(prog>0.18 && prog<0.72){
    const a=(prog-0.18)/0.54;
    ctx.save(); ctx.globalAlpha=(1-a)*0.85;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=5-a*3; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(6,-23,46,-1.25+a*1.9, -0.75+a*1.9); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawParticles(){
  for(const q of particles){
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.fillStyle=q.color;
    ctx.fillRect(q.x-camX-q.size/2,q.y-q.size/2,q.size,q.size);
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  const pal=def.palette;
  ctx.fillStyle=pal.night?'rgba(12,18,38,.55)':'rgba(255,255,255,.62)';
  ctx.fillRect(0,0,W,52);
  ctx.fillStyle=pal.night?'rgba(255,255,255,.12)':'rgba(31,41,55,.1)';
  ctx.fillRect(0,51,W,1);

  heart(22,26,player.hp>=1,'#ef4444');
  heart(48,26,player.hp>=2,'#ef4444');
  heart(74,26,player.hp>=3,'#ef4444');

  ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='left'; ctx.fillStyle=pal.ink;
  ctx.fillText(def.tag+' · '+def.name,108,27);

  ctx.fillStyle='#f5b521'; ctx.beginPath(); ctx.arc(296,21,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=pal.ink; ctx.fillText('× '+coinCount,310,27);
  ctx.fillStyle=pal.ink; ctx.globalAlpha=0.65; ctx.fillText('得分 '+score,400,27); ctx.globalAlpha=1;

  const px=560,pw=350;
  ctx.fillStyle=pal.night?'rgba(255,255,255,.16)':'rgba(31,41,55,.12)';
  ctx.fillRect(px,22,pw,7);
  const ratio=clamp((player.x-def.spawn.x)/(def.goal.x-def.spawn.x),0,1);
  ctx.fillStyle='#e05a3c'; ctx.fillRect(px,22,pw*ratio,7);
  ctx.fillStyle='#f8fafc'; ctx.beginPath(); ctx.arc(px+pw*ratio,25.5,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e05a3c'; ctx.beginPath(); ctx.arc(px+pw*ratio,25.5,3.5,0,Math.PI*2); ctx.fill();

  if(toastTimer>0){
    ctx.globalAlpha=Math.min(1,toastTimer*2);

    roundRect(W/2-105,68,210,34,10); ctx.fill();
    ctx.fillStyle=pal.ink; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText(toastText,W/2,90); ctx.globalAlpha=1; ctx.textAlign='left';
  }

  if(introTimer>0){
    const a=Math.min(1,introTimer*1.6, (2.0-introTimer)*4);
    ctx.globalAlpha=clamp(a,0,1);
    ctx.fillStyle=pal.night?'rgba(12,18,38,.7)':'rgba(255,255,255,.8)';
    roundRect(W/2-180,175,360,110,16); ctx.fill();
    ctx.fillStyle=pal.ink; ctx.textAlign='center';
    ctx.font='bold 15px sans-serif'; ctx.fillText(def.tag,W/2,210);
    ctx.font='bold 34px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(def.name,W/2,254);
    ctx.globalAlpha=1; ctx.textAlign='left';
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawHints(){
  ctx.font='bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  for(const h of def.hints){
    const x=h.x-camX;
    if(x<-90||x>W+90) continue;
    ctx.globalAlpha=0.55+0.25*Math.sin(time*3);
    ctx.fillStyle=def.palette.night?'rgba(255,255,255,.85)':'rgba(31,41,55,.72)';
    const hy = h.y || 318;
    ctx.fillText(h.text,x,hy);
    ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x,hy+6); ctx.lineTo(x,hy+16); ctx.stroke();
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const dpr = canvas.width/W;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!def) return;
  const sx=shake>0?(Math.random()-0.5)*shake:0;
  const sy=shake>0?(Math.random()-0.5)*shake:0;
  ctx.save();
  ctx.translate(sx,sy);
  drawBackground(def.palette);
  ctx.save(); ctx.translate(-camX,0);
  drawPlatforms(def.palette);
  drawFlags();
  drawCoins();
  drawHints();
  drawEnemies();
  drawPlayer();
  drawParticles();
  ctx.restore();
  drawHUD();
  ctx.restore();
}

function loop(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

loadLevel(0);
state='start';
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
